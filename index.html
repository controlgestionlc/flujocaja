<style>
:root{
  --bg:#eceff1;--card:#fff;--ink:#263238;--muted:#607d8b;--line:#cfd8dc;
  --brand:#37474f;--brand2:#546e7a;--in:#2e7d32;--out:#c62828;--warn:#b7791f;

  --row-saldo:#e8edf0;--hover:#dde5ea;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:12px;align-items:center;flex-wrap:wrap}

header.top .ver{font-size:11px;font-weight:500;opacity:.7;margin-left:4px;letter-spacing:0}
header.top .sp{flex:1}
header.top select{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:8px;padding:6px 8px;max-width:220px}
header.top select option{color:#000}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;color:#fffc;padding:7px 12px;border-radius:8px;cursor:pointer}
nav.tabs button.on{background:#fff2;color:#fff;font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.banner{background:#fff4d6;border:1px solid #f0d58a;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.row>label.btn{display:inline-flex;flex-direction:row;align-items:center;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.dan{color:var(--out);border-color:#e8c3bd}
.btn.sm{padding:4px 8px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

.pos{color:var(--in)}.neg{color:var(--out)}
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
table.flujo td:first-child,table.flujo th:first-child{position:sticky;left:0;background:#fff;z-index:2;min-width:190px}

table.flujo td.click:hover{background:var(--hover)}
tr.pagado td{color:#90a4ae;text-decoration:line-through}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#e3e8eb;color:var(--brand)}
.tag.cxp{background:#fbecea;color:var(--out)}.tag.cxc{background:#e7f4ec;color:var(--in)}.tag.man{background:#fff4d6;color:#8a5a00}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

.chart{width:100%;height:190px}
.login{max-width:360px;margin:12vh auto}
.bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}

.ac{position:relative}
.ac input{width:100%}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px #0002;max-height:260px;overflow:auto;z-index:70}

.docbox{grid-column:1/-1;border:1px solid var(--line);background:#f7f9fa;border-radius:8px;padding:10px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}

  main{padding:12px 12px 90px}
  .form{grid-template-columns:1fr}
  .kpi .v{font-size:17px}
  table.cards thead{display:none}

  table.cards tr{border-bottom:1px solid var(--line);padding:8px 10px}

  table.cards td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
}
@media (min-width:761px){nav.tabs button .ic,nav.tabs .sm,header.top h1 .sm{display:none}}
@media (max-width:760px){nav.tabs .lg,header.top h1 .lg{display:none}.banner{font-size:12px;padding:6px 10px}}

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Flujo de Caja Consolidado · multiempresa / multicuenta
   Datos: Firebase Firestore (config.js) o modo local (localStorage)
   ===================================================================== */
const APP_NAME = 'Flujo de Caja Consolidado';
const APP_VERSION = '1.3.0';             // sube también VERSION en sw.js al publicar
const CHANGELOG = [
  ['1.3.0','22-09-2026','Auxiliar de clientes y proveedores (RUT validado). Cobranza clientes y Pago proveedores exigen cliente/proveedor y N° de documento con buscador dinámico por RUT o nombre. Los documentos importados alimentan el auxiliar y reemplazan los ingresados a mano con el mismo RUT y folio.'],
  ['1.2.0','22-09-2026','Nuevo nombre "Flujo de Caja Consolidado" y número de versión visible.'],
  ['1.1.0','22-09-2026','Paleta de colores azul grisáceo e ícono nuevo.'],
  ['1.0.0','22-09-2026','Versión inicial: empresas, cuentas, importación Excel CxC/CxP, movimientos manuales, flujo consolidado.'],
];
const PFX = 'fc_';                       // prefijo de colecciones en Firestore
const COLS = ['empresas','cuentas','movimientos','config','auxiliares'];
const CAT_CXC = 'Cobranza clientes', CAT_CXP = 'Pago proveedores';
const CATEGORIAS = {
  ingreso:['Cobranza clientes','Crédito bancario (desembolso)','Línea de crédito (giro)','Aporte de socios','Préstamo empresa relacionada','Traspaso entre cuentas','Venta de activos','Otros ingresos'],
  egreso:['Pago proveedores','Cuota crédito bancario','Leasing','Línea de crédito (abono)','Remuneraciones','Impuestos (F29 / F22)','Imposiciones','Arriendos','Retiro de socios','Préstamo empresa relacionada','Traspaso entre cuentas','Otros egresos']
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = pDate(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s,n) => { const d = pDate(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return ymd(d); };
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fDate = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}-${m}-${y}`; };
const fmt = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n||0)).toLocaleString('es-CL');
const fmtK = n => { const a=Math.abs(n); const s = a>=1e9? (a/1e9).toFixed(1)+' MM' : a>=1e6? (a/1e6).toFixed(1)+' M' : a>=1e3? Math.round(a/1e3)+' K' : Math.round(a); return (n<0?'-':'')+'$'+s; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
function hashId(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(msg, ms=2600){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
const normRut = r => String(r||'').toUpperCase().replace(/[^0-9K]/g,'');
const normTxt = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function dvRut(num){ let s=0,m=2; for(let i=num.length-1;i>=0;i--){ s+= +num[i]*m; m = m===7?2:m+1; } const r = 11-(s%11); return r===11?'0': r===10?'K': String(r); }
function rutValido(r){ const n = normRut(r); if(n.length<2) return false; const cuerpo=n.slice(0,-1), dv=n.slice(-1); return /^\d+$/.test(cuerpo) && dvRut(cuerpo)===dv; }
function fmtRut(r){ const n = normRut(r); if(n.length<2) return String(r||''); const c=n.slice(0,-1), dv=n.slice(-1); return c.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv; }
const TIPOS_DOC = [['FAC','Factura'],['FEX','Factura exenta'],['BOL','Boleta'],['NC','Nota de crédito'],['ND','Nota de débito'],['GD','Guía de despacho'],['OTR','Otro']];
function parseMonto(v){
  if(v==null || v==='') return null;
  if(typeof v==='number') return Math.round(v);
  let s = String(v).trim(); const neg = /^\(.*\)$/.test(s) || /^-/.test(s);
  s = s.replace(/[^\d,\.]/g,''); if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); if(isNaN(n)) return null; return Math.round(neg? -n : n);
}
function parseFecha(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return ymd(v);
  if(typeof v==='number' && v>20000 && v<80000){ const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return null;
}

/* =====================================================================
   STORE: capa de datos (Firestore o local)
   ===================================================================== */
const Store = {
  mode:'local', db:null, user:null,
  data:{empresas:[],cuentas:[],movimientos:[],config:[],auxiliares:[]},
  unsub:[],
  get hasFirebase(){ const c = window.FLUXCAJA_FIREBASE; return !!(c && c.apiKey && c.projectId && window.firebase); },
  initLocal(){
    this.mode='local';
    const d = ls.get('fluxcaja_local_v1', null);
    if(d) COLS.forEach(c => this.data[c] = d[c] || []);
  },
  saveLocal(){ ls.set('fluxcaja_local_v1', this.data); },
  async initFirebase(){
    this.mode='firebase';
    firebase.initializeApp(window.FLUXCAJA_FIREBASE);
    this.db = firebase.firestore();
    try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('Persistencia offline no disponible', e.code); }
    return new Promise(res => {
      firebase.auth().onAuthStateChanged(u => {
        this.user = u; this.unsub.forEach(f=>f()); this.unsub=[];
        if(u) this.subscribe();
        res(); render();
      });
    });
  },
  subscribe(){
    COLS.forEach(c => {
      const f = this.db.collection(PFX+c).onSnapshot(snap => {
        this.data[c] = snap.docs.map(d => ({...d.data(), id:d.id}));
        scheduleRender();
      }, err => { console.error(err); toast('Error de lectura: '+err.message, 5000); });
      this.unsub.push(f);
    });
  },
  async putMany(col, arr){
    if(!arr.length) return;
    arr.forEach(o => { if(!o.id) o.id = uid(); o.upd = Date.now(); });
    if(this.mode==='local'){
      const map = new Map(this.data[col].map(o=>[o.id,o]));
      arr.forEach(o => map.set(o.id, {...o}));
      this.data[col] = [...map.values()]; this.saveLocal(); scheduleRender(); return;
    }
    for(let i=0;i<arr.length;i+=400){
      const b = this.db.batch();
      arr.slice(i,i+400).forEach(o => { const {id,...rest} = o; b.set(this.db.collection(PFX+col).doc(id), clean(rest)); });
      await b.commit();
    }
  },
  put(col, o){ return this.putMany(col,[o]); },
  async delMany(col, ids){
    if(!ids.length) return;
    if(this.mode==='local'){ const s=new Set(ids); this.data[col] = this.data[col].filter(o=>!s.has(o.id)); this.saveLocal(); scheduleRender(); return; }
    for(let i=0;i<ids.length;i+=400){
      const b = this.db.batch(); ids.slice(i,i+400).forEach(id => b.delete(this.db.collection(PFX+col).doc(id))); await b.commit();
    }
  },
  del(col,id){ return this.delMany(col,[id]); },
};
function clean(o){ const r={}; for(const k in o){ if(o[k]!==undefined) r[k]=o[k]; } return r; }
const E = () => [...Store.data.empresas].sort((a,b)=>(a.orden??0)-(b.orden??0) || a.nombre.localeCompare(b.nombre));
const empresa = id => Store.data.empresas.find(e=>e.id===id);
const cuenta = id => Store.data.cuentas.find(c=>c.id===id);
const cuentasDe = eid => Store.data.cuentas.filter(c=>c.empresaId===eid).sort((a,b)=>(b.porDefecto?1:0)-(a.porDefecto?1:0) || (a.alias||'').localeCompare(b.alias||''));
const cuentaLabel = c => c ? `${c.alias || c.banco} ${c.numero? '· '+c.numero : ''}`.trim() : '(sin cuenta)';
const cfg = key => (Store.data.config.find(c=>c.id===key)||{}).valor;
const fEf = m => m.fechaProg || m.fecha;            // fecha efectiva (reprogramada o vencimiento)
const efecto = m => (m.tipo==='ingreso'? 1 : -1) * (m.monto||0);
const esDocCat = c => c===CAT_CXC || c===CAT_CXP;
const auxId = rut => 'a_' + normRut(rut);
const aux = id => Store.data.auxiliares.find(a=>a.id===id);
const auxTipoDe = cat => cat===CAT_CXC ? 'cliente' : 'proveedor';
const AUX_LBL = {cliente:'Cliente', proveedor:'Proveedor', ambos:'Cliente y proveedor'};
function buscarAux(q, tipo){
  const L = Store.data.auxiliares.filter(a => !tipo || a.tipo===tipo || a.tipo==='ambos');
  const nq = normTxt(q).trim(); const nr = normRut(q); const esRut = /\d{2,}/.test(q);
  if(!nq) return [...L].sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,30);
  const ws = nq.split(/\s+/);
  const res = [];
  L.forEach(a => {
    const nn = normTxt(a.nombre), ar = normRut(a.rut); let sc = -1;
    if(esRut && nr && ar.startsWith(nr)) sc = 0;
    else if(esRut && nr.length>=3 && ar.includes(nr)) sc = 1;
    else if(nn.startsWith(nq)) sc = 2;
    else if(ws.every(w=>nn.includes(w))) sc = 3;
    if(sc>=0) res.push([sc,a]);
  });
  return res.sort((x,y)=>x[0]-y[0] || x[1].nombre.localeCompare(y[1].nombre)).slice(0,30).map(x=>x[1]);
}
/* agrega/actualiza auxiliares a partir de [{rut,nombre,tipo}] */
async function upsertAux(lista){
  const map = new Map(Store.data.auxiliares.map(a=>[a.id,{...a}])); const cambios = new Map();
  lista.forEach(({rut,nombre,tipo}) => {
    const n = normRut(rut); if(n.length<2) return;
    const id = 'a_'+n; const x = map.get(id);
    if(!x){ const o = {id, rut:fmtRut(n), nombre:String(nombre||'').trim() || fmtRut(n), tipo}; map.set(id,o); cambios.set(id,o); return; }
    let ch = false;
    if(x.tipo!==tipo && x.tipo!=='ambos'){ x.tipo='ambos'; ch=true; }
    if((!x.nombre || x.nombre===x.rut) && nombre){ x.nombre=String(nombre).trim(); ch=true; }
    if(ch) cambios.set(id,x);
  });
  await Store.putMany('auxiliares', [...cambios.values()]);
  return cambios.size;
}

function periodos(gran, n){
  const res=[]; const t = today();
  let ini;
  if(gran==='sem'){ const d=pDate(t); const dow=(d.getDay()+6)%7; ini = addDays(t,-dow); }
  else ini = t.slice(0,8)+'01';
  for(let i=0;i<n;i++){
    let fin, label;
    if(gran==='sem'){ fin = addDays(ini,6); const d=pDate(ini); label = `${pad(d.getDate())}-${MES[d.getMonth()]}`; }
    else if(gran==='dia'){ fin = ini; const d=pDate(ini); label = `${pad(d.getDate())}-${MES[d.getMonth()]}`; }
    else { fin = addDays(addMonths(ini,1),-1); const d=pDate(ini); label = `${MES[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; }
    res.push({ini, fin, label});
    ini = addDays(fin,1);
  }
  return res;
}
function calcFlujo(empSel, ctaSel, gran, n){
  const t = today();
  let ini = gran==='dia'? t : null;
  const pers = gran==='dia' ? (()=>{const r=[];let d=t;for(let i=0;i<n;i++){const x=pDate(d);r.push({ini:d,fin:d,label:`${pad(x.getDate())}-${MES[x.getMonth()]}`});d=addDays(d,1);}return r;})() : periodos(gran,n);
  const cols = [{ini:'0000-00-00', fin:addDays(t,-1), label:'Vencido', venc:true}, ...pers];
  const ctas = Store.data.cuentas.filter(c => (empSel==='*' || c.empresaId===empSel) && (ctaSel==='*' || c.id===ctaSel));
  const saldoIni = ctas.reduce((s,c)=>s+(+c.saldo||0),0);
  const cupo = ctas.reduce((s,c)=>s+(+c.cupoLinea||0),0);
  const movs = Store.data.movimientos.filter(m => m.estado!=='pagado' && (empSel==='*' || m.empresaId===empSel) && (ctaSel==='*' || m.cuentaId===ctaSel));
  const cells = {ingreso:{}, egreso:{}}; const ids = {};
  let fuera = 0;
  const hMax = cols[cols.length-1].fin;
  movs.forEach(m => {
    const f = fEf(m); if(!f) return;
    if(f > hMax){ fuera++; return; }
    let ci = f < t ? 0 : cols.findIndex((c,i)=> i>0 && f>=c.ini && f<=c.fin);
    if(ci<0){ ci = 1; } // antes del primer período (mismo día/semana en curso)
    const cat = m.categoria || (m.tipo==='ingreso'?'Otros ingresos':'Otros egresos');
    const tbl = cells[m.tipo]; (tbl[cat] ||= Array(cols.length).fill(0))[ci] += (m.monto||0);
    ((ids[m.tipo+'|'+cat] ||= Array.from({length:cols.length},()=>[]))[ci]).push(m.id);
  });
  const sum = tbl => cols.map((_,i)=>Object.values(tbl).reduce((s,a)=>s+a[i],0));
  const ti = sum(cells.ingreso), te = sum(cells.egreso);
  const neto = cols.map((_,i)=>ti[i]-te[i]);
  const sIni=[], sFin=[]; let s = saldoIni;
  cols.forEach((_,i)=>{ sIni.push(s); s+=neto[i]; sFin.push(s); });
  const cxc = movs.filter(m=>m.categoria===CAT_CXC).reduce((a,m)=>a+m.monto,0);
  const cxp = movs.filter(m=>m.categoria===CAT_CXP).reduce((a,m)=>a+m.monto,0);
  let min = Infinity, minI = 0; sFin.forEach((v,i)=>{ if(v<min){min=v;minI=i;} });
  return {cols, cells, ids, ti, te, neto, sIni, sFin, saldoIni, cupo, cxc, cxp, fuera, min, minCol: cols[minI], ctas};
}

function drawChart(){

async function bulk(acc){
  const ids = new Set(UI.mov.sel); const ms = Store.data.movimientos.filter(m=>ids.has(m.id));
  if(!ms.length) return;
  if(acc==='borrar'){ if(!confirm(`¿Eliminar ${ms.length} movimientos?`)) return; await Store.delMany('movimientos', ms.map(m=>m.id)); UI.mov.sel.clear(); toast('Eliminados'); return; }
  if(acc==='pagado' || acc==='pendiente'){ await Store.putMany('movimientos', ms.map(m=>({...m, estado:acc, fechaPago: acc==='pagado'? today(): null}))); UI.mov.sel.clear(); toast('Actualizado'); return; }
  if(acc==='cuenta'){
    const emps = new Set(ms.map(m=>m.empresaId));
    if(emps.size>1){ alert('Selecciona movimientos de una sola empresa para asignar cuenta.'); return; }
    const eid=[...emps][0];
    modal(`<h3>Asignar cuenta a ${ms.length} movimientos</h3><select id="bkC" style="width:100%">${cuentasDe(eid).map(c=>`<option value="${c.id}">${esc(cuentaLabel(c))}</option>`).join('')}</select>

    return;
  }
  if(acc==='fecha'){
    modal(`<h3>Reprogramar ${ms.length} movimientos</h3><p class="small muted">Se conserva la fecha de vencimiento original; la nueva fecha es la que usa el flujo y no se pisa al reimportar.</p><input type="date" id="bkF" value="${today()}" style="width:100%">
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" id="bkR">Volver a vencimiento original</button><button class="btn pri" id="bkOk">Reprogramar</button></div>`);
    $('#bkOk').onclick = async()=>{ const f=$('#bkF').value; if(!f) return; await Store.putMany('movimientos', ms.map(m=>({...m, fechaProg:f}))); closeModal(); UI.mov.sel.clear(); toast('Reprogramado'); };
    $('#bkR').onclick = async()=>{ await Store.putMany('movimientos', ms.map(m=>({...m, fechaProg:null}))); closeModal(); UI.mov.sel.clear(); toast('Fechas restauradas'); };
  }
}

function catMovChange(){

  const t = $('#mT').value, cat = $('#mK').value; const need = t!=='traspaso' && esDocCat(cat);
  box.classList.toggle('hide', !need); $('#lP').classList.toggle('hide', need);

function auxInfo(){
  const a = _auxSel && aux(_auxSel); const el = $('#auxInfo'); if(!el) return;
  el.textContent = a ? `✓ ${AUX_LBL[a.tipo]} seleccionado` : '';
}
function auxBuscar(){
  const q = $('#mAux').value; const tipo = auxTipoDe($('#mK').value);
  const r = buscarAux(q, tipo); const L = $('#mAuxL'); _acIdx = -1;
  const nombreT = tipo==='cliente'?'cliente':'proveedor';
  L.innerHTML = r.map(a=>`<div class="ac-i" data-id="${a.id}" onmousedown="auxElegir('${a.id}')"><span>${esc(a.nombre)}</span><span class="muted small">${esc(a.rut)}</span></div>`).join('')
    + (!r.length && !q.trim() ? `<div class="ac-i vacio">Aún no hay ${nombreT}s en el auxiliar</div>` : '')
    + (!r.length && q.trim() ? `<div class="ac-i vacio">Sin coincidencias</div>` : '')
    + `<div class="ac-i new" onmousedown="auxNuevoInline()">+ Crear ${nombreT}${q.trim()?` "${esc(q.trim())}"`:''}</div>`;
  L.classList.remove('hide');
}
function auxCerrar(){ $('#mAuxL')?.classList.add('hide'); }
function auxTecla(e){
  const L = $('#mAuxL'); if(!L || L.classList.contains('hide')){ if(e.key==='ArrowDown') auxBuscar(); return; }
  const it = [...L.querySelectorAll('.ac-i:not(.vacio)')]; if(!it.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); _acIdx = (_acIdx + (e.key==='ArrowDown'?1:-1) + it.length) % it.length; it.forEach((x,i)=>x.classList.toggle('on',i===_acIdx)); it[_acIdx].scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); const x = it[_acIdx>=0?_acIdx:0]; x.dispatchEvent(new MouseEvent('mousedown')); }
  else if(e.key==='Escape'){ e.stopPropagation(); auxCerrar(); }
}
function auxElegir(id){
  const a = aux(id); if(!a) return; _auxSel = id;
  $('#mAux').value = `${a.nombre} · ${a.rut}`; auxCerrar(); auxInfo(); $('#mFo').focus();

function auxNuevoInline(){

async function auxCrearInline(){
  const r = $('#anR').value, n = $('#anN').value.trim(); const tipo = auxTipoDe($('#mK').value);
  if(!rutValido(r)){ toast('RUT no válido (revisa el dígito verificador)'); return; }
  if(!n){ toast('Ingresa el nombre'); return; }
  const id = auxId(r); const x = aux(id);
  if(x){ toast(`Ya existe: ${x.nombre}`); if(x.tipo!==tipo && x.tipo!=='ambos') await Store.put('auxiliares',{...x, tipo:'ambos'}); }
  else await Store.put('auxiliares', {id, rut:fmtRut(r), nombre:n, tipo});
  $('#auxNew').classList.add('hide'); auxElegir(id);
}
async function guardarMov(id){
  const g = s => $(s)?.value;
  const base = { empresaId:g('#mE'), cuentaId:g('#mC')||null, fecha:g('#mF'), monto:Math.round(+g('#mM')||0), contraparte:g('#mP').trim(), glosa:g('#mG').trim() };
  if(!base.fecha || !base.monto){ toast('Fecha y monto son obligatorios'); return; }
  const tSel = g('#mT'), catSel = g('#mK');
  if(!window._movImp && tSel!=='traspaso' && esDocCat(catSel)){
    const a = _auxSel && aux(_auxSel); const quien = catSel===CAT_CXC?'cliente':'proveedor';
    if(!a){ toast(`Selecciona el ${quien} desde el buscador (o créalo)`); $('#mAux').focus(); return; }
    const folio = g('#mFo').trim(); if(!folio){ toast('Ingresa el N° de documento'); $('#mFo').focus(); return; }
    Object.assign(base, {auxId:a.id, rut:a.rut, contraparte:a.nombre, tipoDoc:g('#mTD'), folio});
    const dup = Store.data.movimientos.find(x => x.id!==id && x.empresaId===base.empresaId && x.categoria===catSel && normRut(x.rut)===normRut(a.rut) && String(x.folio)===folio);
    if(dup && !confirm(`Ya existe el documento ${dup.tipoDoc||''} ${folio} de ${a.nombre} (${fmt(dup.monto)}, ${fDate(fEf(dup))}). ¿Guardar de todas formas?`)) return;
  }
  if(id){
    const m = Store.data.movimientos.find(x=>x.id===id);
    const nm = {...m, ...base, tipo:g('#mT'), categoria:g('#mK'), fechaProg:g('#mFP')||null, estado:g('#mS')};
    if(m.cuentaId!==nm.cuentaId) nm.cuentaManual = true;
    if(nm.estado==='pagado' && m.estado!=='pagado') nm.fechaPago = today();
    await Store.put('movimientos', nm); closeModal(); toast('Guardado'); return;
  }
  const n = Math.max(1, +g('#mN')||1), fr = g('#mR'); const grupo = n>1? uid(): null;
  const fechaN = i => fr==='m'? addMonths(base.fecha,i) : fr==='t'? addMonths(base.fecha,3*i) : fr==='a'? addMonths(base.fecha,12*i) : addDays(base.fecha, (fr==='s'?7:14)*i);
  const out = [];
  if(g('#mT')==='traspaso'){
    const dest = cuenta(g('#mD')); if(!dest || !base.cuentaId){ toast('Elige cuenta origen y destino'); return; }
    if(dest.id===base.cuentaId){ toast('Origen y destino son la misma cuenta'); return; }
    const cruzado = dest.empresaId!==base.empresaId; const cat = cruzado? 'Préstamo empresa relacionada':'Traspaso entre cuentas';
    for(let i=0;i<n;i++){
      const tg = uid(); const f = fechaN(i); const cu = n>1? `${i+1}/${n}`:null;
      out.push({...base, id:uid(), fecha:f, tipo:'egreso', categoria:cat, origen:'manual', estado:'pendiente', grupo, traspaso:tg, cuota:cu, contraparte: base.contraparte || (empresa(dest.empresaId)?.nombre+' · '+cuentaLabel(dest))});
      out.push({...base, id:uid(), fecha:f, empresaId:dest.empresaId, cuentaId:dest.id, tipo:'ingreso', categoria:cat, origen:'manual', estado:'pendiente', grupo, traspaso:tg, cuota:cu, contraparte: empresa(base.empresaId)?.nombre+' · '+cuentaLabel(cuenta(base.cuentaId))});
    }
  } else {
    for(let i=0;i<n;i++) out.push({...base, id:uid(), fecha:fechaN(i), tipo:g('#mT'), categoria:g('#mK'), origen:'manual', estado:'pendiente', grupo, cuota: n>1? `${i+1}/${n}`:null});
  }
  await Store.putMany('movimientos', out); closeModal(); toast(`${out.length} movimiento(s) creados`);
}
async function borrarMov(id){
  const m = Store.data.movimientos.find(x=>x.id===id);
  const ids = m.traspaso? Store.data.movimientos.filter(x=>x.traspaso===m.traspaso).map(x=>x.id) : [id];
  if(!confirm(ids.length>1? 'Se eliminará el traspaso completo (egreso e ingreso). ¿Continuar?' : '¿Eliminar este movimiento?')) return;
  await Store.delMany('movimientos', ids); closeModal(); toast('Eliminado');
}
async function borrarGrupo(g){
  const ids = Store.data.movimientos.filter(x=>x.grupo===g && x.estado!=='pagado').map(x=>x.id);
  if(!confirm(`¿Eliminar las ${ids.length} cuotas pendientes de esta serie?`)) return;
  await Store.delMany('movimientos', ids); closeModal(); toast('Serie eliminada');
}

function impSet(k,v){ UI.imp = UI.imp || {}; UI.imp[k]=v; if(UI.imp.rows) impPreview(); else render(); }
async function impFile(file){
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:false});
  UI.imp = { emp: $('#iE').value, origen: $('#iO').value, wb, file:file.name, sheet: wb.SheetNames[0] };
  impLoadSheet();
}
function impLoadSheet(){
  const st = UI.imp; const ws = st.wb.Sheets[st.sheet];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  let h = 0; for(let i=0;i<Math.min(rows.length,30);i++){ const tx = rows[i].filter(v=>typeof v==='string' && v.trim() && isNaN(parseMonto(v)??NaN)).length; if(tx>=3){ h=i; break; } }
  st.rows = rows; st.head = h; impAutoMap(); impPreview();
}
function impAutoMap(){
  const st = UI.imp; const hdr = (st.rows[st.head]||[]).map(v=>String(v).toLowerCase().trim());
  const saved = ls.get('fc_map_'+st.origen, null);
  st.map = {};

function impPreview(){
  const st = UI.imp; const m = st.map; const emp = st.emp || $('#iE')?.value; st.emp = emp;
  const tipo = st.origen==='cxc'? 'ingreso':'egreso';
  const ctas = cuentasDe(emp); const def = ctas.find(c=>c.porDefecto) || ctas[0];
  const matchCta = v => { const s = String(v||'').toLowerCase().replace(/[^a-z0-9]/g,''); if(!s) return null; return ctas.find(c => { const n=String(c.numero||'').replace(/[^0-9]/g,''); return (n && s.includes(n)) || (c.alias && s===c.alias.toLowerCase().replace(/[^a-z0-9]/g,'')); }); };
  const docs = [], errs = []; const seen = new Map();
  st.rows.slice(st.head+1).forEach((r,ix) => {
    if(!r.some(v=>v!=='' && v!=null)) return;
    const get = k => m[k]==null? '' : r[m[k]];
    const monto = parseMonto(get('monto')); const fecha = parseFecha(get('fecha'));
    const contraparte = String(get('contraparte')||'').trim();
    if(monto==null || fecha==null){
      if(ix<3 && !contraparte) return; // filas de subtítulos
      if(/total/i.test(r.join(' '))) return;
      errs.push(`Fila ${st.head+ix+2}: ${monto==null?'monto':'fecha'} no válido`); return;
    }
    if(monto===0) return;
    const rut = String(get('rut')||'').trim(), tipoDoc = String(get('tipoDoc')||'').trim(), folio = String(get('folio')||'').trim();
    let clave = [emp, st.origen, normRut(rut), tipoDoc.toUpperCase(), folio].join('|');
    if(!folio) clave = [emp, st.origen, normRut(rut)||contraparte.toUpperCase(), fecha, monto].join('|');
    const n = (seen.get(clave)||0)+1; seen.set(clave,n); if(n>1) clave += '|'+n;
    const cta = m.cuenta!=null ? matchCta(get('cuenta')) : null;
    docs.push({ id:'d_'+hashId(clave), clave, empresaId:emp, origen:st.origen, tipo, categoria: st.origen==='cxc'?CAT_CXC:CAT_CXP,
      fecha, monto: Math.abs(monto) * (monto<0?-1:1), contraparte, rut, tipoDoc, folio, emision: parseFecha(get('emision')), glosa:String(get('glosa')||'').trim(),
      auxId: normRut(rut).length>1 ? auxId(rut) : null,
      _cta: cta?.id || def?.id || null, _ctaExcel: !!cta });
  });
  const existentes = Store.data.movimientos.filter(x=>x.empresaId===emp && x.origen===st.origen);
  const exMap = new Map(existentes.map(x=>[x.id,x]));
  const ids = new Set(docs.map(d=>d.id));
  const nuevos = docs.filter(d=>!exMap.has(d.id));
  const act = docs.filter(d=>exMap.has(d.id));
  const cambian = act.filter(d=>{ const x=exMap.get(d.id); return x.monto!==d.monto || x.fecha!==d.fecha || x.estado==='pagado'; });
  const cerrar = existentes.filter(x=>x.estado!=='pagado' && !ids.has(x.id));
  // documentos ingresados a mano con mismo RUT + folio: el importado los reemplaza
  const cat = st.origen==='cxc'?CAT_CXC:CAT_CXP;
  const manMap = new Map(Store.data.movimientos.filter(x=>x.empresaId===emp && x.origen==='manual' && x.categoria===cat && x.folio && x.rut).map(x=>[normRut(x.rut)+'|'+String(x.folio).trim(), x]));
  const reempl = []; docs.forEach(d => { const x = manMap.get(normRut(d.rut)+'|'+d.folio); if(x){ d._man = x; reempl.push(x); } });
  st.prev = {docs, errs, nuevos, act, cambian, cerrar, reempl, total: docs.reduce((s,d)=>s+d.monto,0), cerrarOk: st.prev?.cerrarOk ?? true};
  render();
}

async function impConfirmar(){
  const st = UI.imp, p = st.prev;
  const exMap = new Map(Store.data.movimientos.map(x=>[x.id,x]));
  const lote = today()+' '+st.file;
  const out = p.docs.map(d => {
    const {_cta,_ctaExcel,_man,...doc} = d; const x = exMap.get(d.id);
    if(x){
      const cuentaId = x.cuentaManual ? x.cuentaId : (_ctaExcel ? _cta : (x.cuentaId || _cta));
      return {...x, ...doc, cuentaId, fechaProg: x.fechaProg||null, estado:'pendiente', fechaPago:null, lote};
    }
    if(_man) return {...doc, cuentaId:_man.cuentaId||_cta, cuentaManual:!!_man.cuentaId, fechaProg:_man.fechaProg||null, estado:'pendiente', lote, creado: today()};
    return {...doc, cuentaId:_cta, estado:'pendiente', lote, creado: today()};
  });
  if(p.cerrarOk) p.cerrar.forEach(x => out.push({...x, estado:'pagado', fechaPago: today(), cerradoPorImport: lote}));

  ls.set('fc_map_'+st.origen, mapSave);

    const nAux = await upsertAux(p.docs.map(d=>({rut:d.rut, nombre:d.contraparte, tipo: st.origen==='cxc'?'cliente':'proveedor'})));

  catch(e){ alert('Error al importar: '+e.message); }
  $('#app').style.opacity=1; render();
}

async function guardarAux(id){
  const r = $('#xR').value, n = $('#xN').value.trim();
  if(!rutValido(r)){ toast('RUT no válido (revisa el dígito verificador)'); return; }
  if(!n){ toast('Nombre obligatorio'); return; }
  const nid = auxId(r);
  if(nid!==id && aux(nid)){ toast(`Ese RUT ya existe: ${aux(nid).nombre}`); return; }
  const o = {...(id?aux(id):{}), id:nid, rut:fmtRut(r), nombre:n, tipo:$('#xT').value, obs:$('#xO').value.trim()};
  await Store.put('auxiliares', o);
  // propagar nombre/RUT a los movimientos manuales enlazados
  const rel = Store.data.movimientos.filter(m=>m.auxId===id || m.auxId===nid);
  const upd = rel.filter(m=>m.origen==='manual').map(m=>({...m, auxId:nid, rut:o.rut, contraparte:o.nombre}));
  if(id && id!==nid){ await Store.del('auxiliares', id); rel.filter(m=>m.origen!=='manual').forEach(m=>upd.push({...m, auxId:nid})); }
  if(upd.length) await Store.putMany('movimientos', upd);
  closeModal(); toast('Guardado');
}

async function auxImportExcel(file){
  if(!file) return;
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
  let h=-1, cR=-1, cN=-1;
  for(let i=0;i<Math.min(rows.length,30) && h<0;i++){ const r = rows[i].map(v=>normTxt(v)); const a=r.findIndex(v=>/rut/.test(v)), b=r.findIndex(v=>/razon|nombre|proveedor|cliente/.test(v)); if(a>=0&&b>=0){h=i;cR=a;cN=b;} }
  if(h<0){ alert('No encontré columnas de RUT y Nombre/Razón social en la primera hoja.'); return; }
  const tipo = UI.aux.tipo==='*' ? (confirm('¿Estos registros son CLIENTES?\nAceptar = clientes · Cancelar = proveedores') ? 'cliente':'proveedor') : UI.aux.tipo;
  const lista = rows.slice(h+1).filter(r=>rutValido(r[cR])).map(r=>({rut:r[cR], nombre:r[cN], tipo}));
  const inval = rows.slice(h+1).filter(r=>String(r[cR]).trim() && !rutValido(r[cR])).length;
  const n = await upsertAux(lista);
  toast(`${n} registros agregados/actualizados${inval?` · ${inval} RUT inválidos omitidos`:''}`, 4500);
}

  const c = id? cuenta(id) : {empresaId:eid, banco:'', numero:'', alias:'', saldo:0, fechaSaldo:today(), cupoLinea:0, porDefecto: !cuentasDe(eid).length};
  modal(`<h3>${id?'Editar':'Nueva'} cuenta · ${esc(empresa(c.empresaId)?.nombre)}</h3><div class="form">
    <label>Banco<input id="cB" value="${esc(c.banco)}" list="bancos"></label>
    <datalist id="bancos">${['Banco de Chile','BancoEstado','Santander','BCI','Scotiabank','Itaú','Security','BICE','Internacional','Falabella','Consorcio'].map(b=>`<option>${b}</option>`).join('')}</datalist>
    <label>N° de cuenta<input id="cN" value="${esc(c.numero)}"></label>
    <label>Alias<input id="cA" value="${esc(c.alias)}" placeholder="Ej: BCI principal"></label>
    <label>Línea de crédito (cupo)<input id="cL" type="number" value="${+c.cupoLinea||0}"></label>
    <label>Saldo actual<input id="cS" type="number" value="${+c.saldo||0}"></label>
    <label>Fecha del saldo<input id="cF" type="date" value="${c.fechaSaldo||today()}"></label>
    <label class="full" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="cD" ${c.porDefecto?'checked':''}> Cuenta por defecto (recibe los documentos importados)</label></div>
    <div class="actions">${id?`<button class="btn dan" onclick="borrarCuenta('${id}')">Eliminar</button>`:''}<span style="flex:1"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarCuenta(${id?`'${id}'`:'null'},'${c.empresaId}')">Guardar</button></div>`);
}
async function guardarCuenta(id, eid){
  const o = {...(id?cuenta(id):{id:uid(), empresaId:eid}), banco:$('#cB').value.trim(), numero:$('#cN').value.trim(), alias:$('#cA').value.trim(), cupoLinea:Math.round(+$('#cL').value||0), saldo:Math.round(+$('#cS').value||0), fechaSaldo:$('#cF').value, porDefecto:$('#cD').checked};
  if(!o.banco && !o.alias){ toast('Indica banco o alias'); return; }
  const upd = [o];
  if(o.porDefecto) cuentasDe(eid).filter(c=>c.id!==o.id && c.porDefecto).forEach(c=>upd.push({...c, porDefecto:false}));
  await Store.putMany('cuentas', upd);
  // asignar documentos sin cuenta a la cuenta por defecto
  if(o.porDefecto){ const sin = Store.data.movimientos.filter(m=>m.empresaId===eid && !m.cuentaId); if(sin.length) await Store.putMany('movimientos', sin.map(m=>({...m, cuentaId:o.id}))); }
  closeModal(); toast('Cuenta guardada');
}
async function borrarCuenta(id){
  const n = Store.data.movimientos.filter(m=>m.cuentaId===id).length;
  if(!confirm(`¿Eliminar la cuenta? ${n} movimientos quedarán sin cuenta asignada.`)) return;
  await Store.putMany('movimientos', Store.data.movimientos.filter(m=>m.cuentaId===id).map(m=>({...m, cuentaId:null})));
  await Store.del('cuentas', id); closeModal(); toast('Cuenta eliminada');
}

    ${Store.mode==='firebase'?`<p>Firebase · proyecto <b>${esc(window.FLUXCAJA_FIREBASE.projectId)}</b><br>Usuario: <b>${esc(Store.user?.email)}</b></p><button class="btn" onclick="firebase.auth().signOut()">Cerrar sesión</button>`
      :`<p>Modo local (sin sincronización). Para sincronizar entre equipos, completa <b>config.js</b> con la configuración de tu proyecto Firebase y vuelve a publicar.</p>`}
    <p class="small muted">${Store.data.empresas.length} empresas · ${Store.data.cuentas.length} cuentas · ${Store.data.movimientos.length} movimientos</p>
  </div>
  <div class="card"><h2>Respaldo</h2>
    <p class="small muted">Descarga todos los datos en JSON o restáuralos (útil para migrar de modo local a Firebase).</p>
    <div class="row"><button class="btn" onclick="exportJSON()">Descargar respaldo</button>
    <label class="btn">Restaurar respaldo<input type="file" accept=".json" class="hide" onchange="importJSON(this.files[0])"></label></div>
  </div>

    <p class="small muted">${nPag} movimientos pagados guardados como historial.</p>
    <div class="row"><label>Eliminar pagados con fecha anterior a<input type="date" id="lmF" value="${addMonths(today(),-6)}"></label><button class="btn dan" onclick="limpiar()">Eliminar</button></div>
  </div>
  ${Store.mode==='local'?`<div class="card"><h2>Datos de ejemplo</h2><div class="row"><button class="btn" onclick="cargarDemo()">Cargar ejemplo</button><button class="btn dan" onclick="if(confirm('¿Borrar todos los datos locales?')){COLS.forEach(c=>Store.data[c]=[]);Store.saveLocal();render();}">Borrar todo</button></div></div>`:''}
  <div class="card"><h2>Versión ${APP_VERSION}</h2>
    <div class="small">${CHANGELOG.map(([v,f,t])=>`<p style="margin:4px 0"><b>${v}</b> <span class="muted">${f}</span><br>${esc(t)}</p>`).join('')}</div>
    <button class="btn sm" onclick="actualizarApp()">Buscar actualización</button></div>
  <div class="card"><h2>Instalar</h2><p class="small">En PC (Chrome/Edge): icono de instalar en la barra de direcciones. En Android: menú ⋮ › Instalar app. En iPhone (Safari): Compartir › Agregar a pantalla de inicio.</p>
  ${window._bip?'<button class="btn pri" onclick="_bip.prompt()">Instalar app</button>':''}</div>
  </div>`;
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({app:'fluxcaja', v:1, fecha:today(), data:Store.data},null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `flujo_consolidado_respaldo_${today()}.json`; a.click();
}
async function importJSON(file){
  if(!file) return; try{
    const j = JSON.parse(await file.text()); if(j.app!=='fluxcaja') throw new Error('Archivo no válido');
    if(!confirm('Se agregarán/reemplazarán los registros del respaldo. ¿Continuar?')) return;
    for(const c of COLS) await Store.putMany(c, (j.data[c]||[]).map(o=>({...o})));
    toast('Respaldo restaurado');
  }catch(e){ alert('Error: '+e.message); }
}
async function limpiar(){
  const f = $('#lmF').value; const ids = Store.data.movimientos.filter(m=>m.estado==='pagado' && fEf(m)<f).map(m=>m.id);
  if(!ids.length){ toast('Nada que eliminar'); return; }
  if(!confirm(`¿Eliminar ${ids.length} movimientos pagados?`)) return; await Store.delMany('movimientos', ids); toast('Listo');
}
async function cargarDemo(){
  const t = today(); const e1={id:uid(),nombre:'Agrícola Demo',rut:'76.111.111-1',color:'#2e7355',orden:0}, e2={id:uid(),nombre:'Transportes Demo',rut:'76.222.222-2',color:'#2f5d8a',orden:1};
  const c1={id:uid(),empresaId:e1.id,banco:'BCI',numero:'12345678',alias:'BCI principal',saldo:45000000,fechaSaldo:t,porDefecto:true,cupoLinea:20000000};
  const c2={id:uid(),empresaId:e1.id,banco:'Santander',numero:'987654',alias:'Santander',saldo:8000000,fechaSaldo:t,porDefecto:false};
  const c3={id:uid(),empresaId:e2.id,banco:'Banco de Chile',numero:'555111',alias:'Chile',saldo:12000000,fechaSaldo:t,porDefecto:true};
  const mv=[]; const prov=['Agroquímicos Sur','Combustibles Araucanía','Maderas del Sur','Repuestos Angol','Fertilizantes SpA']; const cli=['Exportadora Frutas','Aserradero Norte','Frigorífico Sur'];
  for(let i=0;i<40;i++){ const e=i%3?e1:e2; mv.push({id:uid(),empresaId:e.id,cuentaId:e===e1?c1.id:c3.id,origen:'cxp',tipo:'egreso',categoria:CAT_CXP,fecha:addDays(t,-10+i*3),monto:Math.round(800000+Math.random()*6e6),contraparte:prov[i%5],rut:'77.'+(100+i)+'.000-'+(i%9),tipoDoc:'FAC',folio:String(1000+i),estado:'pendiente'}); }
  for(let i=0;i<18;i++){ mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'cxc',tipo:'ingreso',categoria:CAT_CXC,fecha:addDays(t,-5+i*6),monto:Math.round(3e6+Math.random()*12e6),contraparte:cli[i%3],rut:'96.'+(500+i)+'.000-1',tipoDoc:'FAC',folio:String(5000+i),estado:'pendiente'}); }
  const g=uid(); for(let i=0;i<24;i++) mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'manual',tipo:'egreso',categoria:'Cuota crédito bancario',fecha:addMonths(addDays(t,5),i),monto:2350000,contraparte:'BCI',glosa:'Crédito comercial',estado:'pendiente',grupo:g,cuota:`${i+1}/24`});
  const g2=uid(); for(let i=0;i<12;i++) mv.push({id:uid(),empresaId:e2.id,cuentaId:c3.id,origen:'manual',tipo:'egreso',categoria:'Leasing',fecha:addMonths(addDays(t,10),i),monto:1850000,contraparte:'BCI Leasing',glosa:'Leasing camión',estado:'pendiente',grupo:g2,cuota:`${i+1}/12`});
  for(let i=0;i<4;i++) mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'manual',tipo:'egreso',categoria:'Remuneraciones',fecha:addMonths(t.slice(0,8)+'28',i),monto:18500000,contraparte:'Personal',estado:'pendiente'});
  const rv = n => { const c=String(n); return fmtRut(c+dvRut(c)); };
  const rutDe = n => rv((n.startsWith('Exp')||n.startsWith('Ase')||n.startsWith('Fri') ? 96500000 : 77100000) + [...n].reduce((h,c)=>(h*31+c.charCodeAt(0))%9973,7));
  mv.forEach(m=>{ if(m.rut){ m.rut = rutDe(m.contraparte); m.auxId = auxId(m.rut); } });
  await upsertAux(mv.filter(m=>m.rut).map(m=>({rut:m.rut, nombre:m.contraparte, tipo:m.origen==='cxc'?'cliente':'proveedor'})));
  await Store.putMany('empresas',[e1,e2]); await Store.putMany('cuentas',[c1,c2,c3]); await Store.putMany('movimientos',mv); toast('Datos de ejemplo cargados');
}

/* ---------- modal ---------- */
function modal(html, wide){ closeModal(); const d=document.createElement('div'); d.className='modal-bg'; d.id='mdl'; d.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`; d.addEventListener('mousedown',e=>{ if(e.target===d) closeModal(); }); document.body.appendChild(d); }
function closeModal(){ $('#mdl')?.remove(); }
addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- PWA ---------- */
async function actualizarApp(){
  try{ const r = await navigator.serviceWorker?.getRegistration(); if(r) await r.update(); }catch(e){}
  toast('Recargando…'); setTimeout(()=>location.reload(), 600);
}
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window._bip=e; });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- arranque ---------- */
(async()=>{
  if(typeof XLSX==='undefined') console.warn('SheetJS no cargó (sin conexión la primera vez).');
  if(Store.hasFirebase){ try{ await Store.initFirebase(); return; }catch(e){ console.error(e); alert('No se pudo iniciar Firebase: '+e.message+'\nSe usará modo local.'); } }
  Store.initLocal(); render();
})();
</script>
