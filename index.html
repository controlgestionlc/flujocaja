<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flujo de Caja Consolidado</title>
<meta name="description" content="Flujo de caja multiempresa y multicuenta">
<meta name="theme-color" content="#354a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* ===== Estilo inspirado en SAP Fiori (Horizon / Quartz) ===== */
:root{
  --bg:#f5f6f7;--card:#fff;--ink:#1d2d3e;--muted:#556b82;--line:#e5e5e5;--line2:#d9d9d9;
  --shell:#354a5f;--shell2:#2c3e50;--brand:#0a6ed1;--brand2:#0854a0;--brand-soft:#ebf5fe;
  --in:#107e3e;--out:#bb0000;--warn:#e9730c;--info:#0a6ed1;
  --soft:#f5f6f7;--row-saldo:#eff4f9;--hover:#f0f5fb;--sel:#e5f0fa;
  --radius:12px;--r-sm:8px;--r-xs:4px;
  --shadow:0 0 .125rem rgba(34,53,72,.15),0 .125rem .5rem rgba(34,53,72,.12);
  --shadow-h:0 0 .125rem rgba(34,53,72,.2),0 .5rem 1rem rgba(34,53,72,.18);
  --font:"72","72full",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* Shell bar */
header.shell{position:sticky;top:0;z-index:40;background:var(--shell);color:#fff;height:48px;padding:0 12px;padding-top:env(safe-area-inset-top);box-sizing:content-box;display:flex;align-items:center;gap:10px}
header.shell .logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#0a6ed1,#5899da);display:grid;place-items:center;flex:none}
header.shell .logo svg{width:18px;height:18px;stroke:#fff}
header.shell h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;letter-spacing:.1px}
header.shell .ver{font-size:11px;font-weight:400;opacity:.65;margin-left:6px}
header.shell .sp{flex:1}
header.shell select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:var(--r-sm);height:32px;padding:0 8px;max-width:230px;cursor:pointer}
header.shell select:hover{background:rgba(255,255,255,.2)}
header.shell select option{color:#000}
header.shell .avatar{width:32px;height:32px;border-radius:50%;background:#5b738b;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;cursor:default}

/* Icon tab bar */
nav.tabs{position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:35;background:#fff;box-shadow:0 1px 0 var(--line),0 2px 4px rgba(34,53,72,.06);display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);height:44px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;border-top:3px solid transparent;white-space:nowrap;font-weight:400}
nav.tabs button:hover{color:var(--brand)}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
nav.tabs .sm{display:none}

/* Dynamic page header */
.dp-head{background:#fff;padding:14px 16px 12px;box-shadow:0 1px 0 var(--line)}
.dp-head .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dp-head h2{margin:0;font-size:20px;font-weight:700;color:var(--ink)}
.dp-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.dp-head .sp{flex:1}
main{max-width:1400px;margin:0 auto;padding:16px}

/* Message strip */
.banner{background:#fef7f1;border:1px solid #fcd8b6;border-left:4px solid var(--warn);padding:8px 12px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13px;color:var(--ink)}
.banner.info{background:var(--brand-soft);border-color:#bfdcf8;border-left-color:var(--brand)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* Inputs */
input,select,textarea{border:1px solid #8396a8;border-radius:var(--r-xs);height:36px;padding:0 10px;background:#fff;min-width:0;color:var(--ink)}
textarea{height:auto;padding:8px 10px}
input[type=checkbox]{height:16px;width:16px;accent-color:var(--brand);vertical-align:middle}
input[type=color]{padding:2px;width:60px}
input:hover,select:hover{border-color:var(--brand);background:#fafcff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
input:disabled{background:var(--soft);border-color:var(--line2);color:var(--muted)}

/* Buttons */
.btn{border:1px solid #bcc3ca;background:#fff;color:var(--brand);border-radius:var(--r-sm);height:36px;padding:0 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.btn:hover{background:var(--hover);border-color:var(--brand)}
.btn:active{background:var(--brand);color:#fff}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.dan{color:var(--out);border-color:#e9a3a3}
.btn.dan:hover{background:#ffebeb;border-color:var(--out)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row>label.btn{display:inline-flex;flex-direction:row;align-items:center;font-size:14px;color:var(--brand)}

/* KPI tiles (Generic Tile) */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:1rem;box-shadow:var(--shadow);padding:14px 16px;min-height:132px;display:flex;flex-direction:column;transition:box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow-h)}
.kpi.clk{cursor:pointer;position:relative}
.kpi.clk::after{content:"›";position:absolute;right:14px;top:10px;font-size:20px;color:var(--brand);opacity:.5}
.kpi.clk:hover{outline:2px solid var(--brand);outline-offset:-2px}
.kpi.clk:hover::after{opacity:1}
.kpi .l{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.kpi .v{font-size:26px;font-weight:300;margin-top:auto;padding-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;color:var(--ink)}
.kpi .s{font-size:12px;line-height:1.4;color:var(--muted);margin-top:4px;min-height:2.8em} /* reserva 2 líneas: el número queda alineado entre tarjetas */
.pos{color:var(--in)}.neg{color:var(--out)}
.kpi .v.pos{color:var(--in)}.kpi .v.neg{color:var(--out)}

/* Tables (Responsive table) */
.tw{overflow:auto;max-width:100%;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.card .tw{box-shadow:none;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:0 12px;height:40px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#fff;font-weight:400;font-size:13px;color:var(--muted);position:sticky;top:0;z-index:1;height:40px;border-bottom:1px solid var(--line2)}
tbody tr:hover td{background:var(--hover)}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:var(--soft)}
table.flujo td:first-child,table.flujo th:first-child{position:sticky;left:0;background:#fff;z-index:2;min-width:200px;box-shadow:1px 0 0 var(--line)}
table.flujo th:first-child{z-index:3}
table.flujo tr.sec td{background:var(--soft);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;height:32px}
table.flujo tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
table.flujo tr.saldo td{font-weight:700;background:var(--row-saldo)}
table.flujo td.click{cursor:pointer}
td.lbl{cursor:pointer;color:var(--brand)}
td.lbl:hover{text-decoration:underline}
td.lbl svg.info{width:13px;height:13px;margin-left:6px;opacity:0;transition:opacity .15s;vertical-align:-2px}
tr:hover td.lbl svg.info{opacity:.8}
table.flujo th.thc{cursor:pointer;color:var(--brand)}
table.flujo th.thc:hover{text-decoration:underline;background:var(--hover)}
td input{height:30px}
table.flujo td.click:hover{background:var(--sel);text-decoration:underline}
tr.pagado td{color:#8396a8}
tr.pagado td[data-l="Monto"],tr.pagado td[data-l="Contraparte"]{text-decoration:line-through}

/* Object status (inverted) */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-xs);font-size:12px;font-weight:600;background:#eff1f2;color:var(--muted);border:1px solid #d5dadd}
.tag.cxc{background:#f5fae5;color:var(--in);border-color:#b8d9a0}
.tag.cxp{background:#ffeaf4;color:var(--out);border-color:#f4b8b8}
.tag.forestal{background:#eef6e8;color:#3a6b1f;border-color:#bcd9a6}
tr.sel td{background:var(--sel)}
.tag.imp{background:#eaf3fd;color:#0854a0;border-color:#b8d4f4}
.tag.man{background:#fff3b8;color:#a45d00;border-color:#f5d174}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.muted{color:var(--muted)}.small{font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid2>.card{margin-bottom:0}

/* Dialog */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);max-width:660px;width:100%;box-shadow:0 1rem 3rem rgba(34,53,72,.35);display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:1040px}
.modal .dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.modal .dlg-h h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal .dlg-c{padding:16px 18px;overflow:auto;flex:1}
.modal .dlg-f{padding:10px 18px;border-top:1px solid var(--line);background:#fff;border-radius:0 0 var(--radius) var(--radius);flex:none}
.modal .dlg-f .actions{margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label,.form .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(29,45,62,.92);color:#fff;padding:12px 18px;border-radius:var(--r-sm);z-index:80;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;font-size:14px}
.chart{width:100%;height:200px;display:block}
.login{max-width:380px;margin:12vh auto}
.bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.hide{display:none!important}

/* Toolbars dentro de tarjetas */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tbar h3{margin:0;font-size:15px;font-weight:700}

/* Autocomplete / auxiliar */
.ac{position:relative}
.ac input{width:100%}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border-radius:var(--r-sm);box-shadow:var(--shadow-h);max-height:260px;overflow:auto;z-index:70;padding:4px 0}
.ac-i{padding:8px 12px;cursor:pointer;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.ac-i.on,.ac-i:hover{background:var(--sel)}
.ac-i.new{color:var(--brand);font-weight:700;border-top:1px solid var(--line)}
.ac-i.vacio{color:var(--muted);cursor:default}
.ac-i.vacio:hover{background:none}
.docbox{grid-column:1/-1;border:1px solid var(--line);background:var(--soft);border-radius:var(--r-sm);padding:12px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.docbox .sub{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr auto auto;gap:8px;align-items:end;border-top:1px dashed var(--line2);padding-top:10px}
.aux-ok{font-size:12px;color:var(--in)}
/* Segmented button */
.seg{display:inline-flex;border:1px solid #bcc3ca;border-radius:var(--r-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:none;height:34px;padding:0 16px;cursor:pointer;color:var(--brand);font-weight:600}
.seg button+button{border-left:1px solid #bcc3ca}
.seg button.on{background:var(--brand-soft);color:var(--brand2);box-shadow:inset 0 -2px 0 var(--brand)}

@media (max-width:760px){
  header.shell h1{font-size:14px}
  header.shell select{max-width:150px}
  header.shell .lg,nav.tabs .lg{display:none}
  header.shell .sm,nav.tabs .sm{display:inline}
  header.shell .avatar{display:none}
  nav.tabs{padding:0 6px}
  nav.tabs button{padding:0 10px}
  .dp-head{padding:10px 12px}
  .dp-head h2{font-size:17px}
  main{padding:12px}
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{min-height:112px;padding:12px}
  .kpi .v{font-size:19px}
  .kpi .l{font-size:13px}
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td,table.cards tfoot{display:block;width:100%}
  table.cards tr{border-bottom:1px solid var(--line);padding:10px 12px}
  table.cards td{border:0;padding:2px 0;height:auto;white-space:normal;text-align:left!important}
  table.cards td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
  .docbox,.docbox .sub{grid-template-columns:1fr}
  .modal-bg{padding:0;align-items:stretch}
  .modal{max-height:none;min-height:100%;border-radius:0}
  .modal .dlg-f{border-radius:0;position:sticky;bottom:0}
}
@media (min-width:761px){header.shell .sm{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Flujo de Caja Consolidado · multiempresa / multicuenta
   Datos: Firebase Firestore (config.js) o modo local (localStorage)
   ===================================================================== */
const APP_NAME = 'Flujo de Caja Consolidado';
const APP_VERSION = '1.9.0';             // sube también VERSION en sw.js al publicar
const CHANGELOG = [
  ['1.9.0','25-09-2026','Roles de usuario (Administrador, Finanzas, Gerencia, Supervisor forestal) con permisos aplicados en Firestore. Pestaña Usuarios para crear accesos y asignar roles. Compromisos forestales: los supervisores registran desde el móvil fecha de pago, monto y detalle del negocio (bosque en pie, madera en planta u orilla de camino); aparecen en el flujo como "Compra de madera y bosques" y la gerencia puede abrir cada uno con "Ver negocio".'],
  ['1.8.2','23-09-2026','Tarjetas KPI alineadas: el monto queda a la misma altura en todas, sin importar el largo del texto inferior.'],
  ['1.8.1','23-09-2026','La app siempre abre en Flujo de caja. Ajustes queda solo con Respaldo y Limpieza; la versión e historial se ven al hacer clic en el número de versión y la sesión se cierra desde el círculo con tus iniciales.'],
  ['1.8.0','23-09-2026','Gráfico del flujo con opción Barras o Línea (se recuerda la elección). Clic en una barra o punto abre el detalle del período.'],
  ['1.7.1','23-09-2026','Tarjetas del Flujo clicables: saldo bancos (detalle por cuenta), por cobrar y por pagar (cartera completa por contraparte, período y detalle), saldo final (por período) y saldo mínimo (período del mínimo).'],
  ['1.7.0','23-09-2026','Etiquetas del flujo clicables con ventana de detalle: cada categoría (por contraparte, por período y detalle con pagar/editar y exportar a Excel), saldo inicial por cuenta, composición de totales, flujo neto y saldo final por período, y cada columna de período.'],
  ['1.6.0','23-09-2026','Dar por pagados los compromisos (fecha y cuenta de pago). Saldo bancario teórico por cuenta = último saldo real + pagos registrados. Nueva pestaña Conciliación: ingreso semanal del saldo real, diferencia contra el teórico, historial y análisis de diferencias (pendientes no marcados, coincidencias exactas, registro de documento faltante). El flujo proyectado parte del saldo teórico.'],
  ['1.5.0','23-09-2026','Importación con el formato REGISTRO FLUJO CAJA (TIPO, DOCUMENTO, NUMERO DOC, FECHA EMISION, VENCIMIENTO, RUT, AUXILIAR, IMPORTE A PAGAR) en un solo archivo de ingresos y egresos. Validación anti-duplicados: omite lo ya ingresado (importado o manual) y los repetidos dentro del archivo; detalle fila por fila antes de cargar. Remuneraciones, imposiciones, impuestos, leasing, etc. se cargan en su categoría. El ingreso manual bloquea documentos duplicados.'],
  ['1.4.0','23-09-2026','Nueva visualización estilo SAP Fiori: barra shell, pestañas con íconos, encabezado de página, KPI en tiles, tablas y diálogos Fiori.'],
  ['1.3.0','22-09-2026','Auxiliar de clientes y proveedores (RUT validado). Cobranza clientes y Pago proveedores exigen cliente/proveedor y N° de documento con buscador dinámico por RUT o nombre. Los documentos importados alimentan el auxiliar y reemplazan los ingresados a mano con el mismo RUT y folio.'],
  ['1.2.0','22-09-2026','Nuevo nombre "Flujo de Caja Consolidado" y número de versión visible.'],
  ['1.1.0','22-09-2026','Paleta de colores azul grisáceo e ícono nuevo.'],
  ['1.0.0','22-09-2026','Versión inicial: empresas, cuentas, importación Excel CxC/CxP, movimientos manuales, flujo consolidado.'],
];
const PFX = 'fc_';                       // prefijo de colecciones en Firestore
const COLS = ['empresas','cuentas','movimientos','config','auxiliares','saldos'];
const CAT_CXC = 'Cobranza clientes', CAT_CXP = 'Pago proveedores';
const CATEGORIAS = {
  ingreso:['Cobranza clientes','Crédito bancario (desembolso)','Línea de crédito (giro)','Aporte de socios','Préstamo empresa relacionada','Traspaso entre cuentas','Venta de activos','Otros ingresos'],
  egreso:['Pago proveedores','Compra de madera y bosques','Cuota crédito bancario','Leasing','Línea de crédito (abono)','Remuneraciones','Impuestos (F29 / F22)','Imposiciones','Arriendos','Retiro de socios','Préstamo empresa relacionada','Traspaso entre cuentas','Otros egresos']
};

/* ---------- íconos (trazos simples estilo Fiori) ---------- */
const ICONS = {
  flujo:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
  mov:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  imp:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/>',

const $ = s => document.querySelector(s);

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = pDate(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s,n) => { const d = pDate(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return ymd(d); };

const fDate = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}-${m}-${y}`; };
const fmt = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n||0)).toLocaleString('es-CL');
const fmtK = n => { const a=Math.abs(n); const s = a>=1e9? (a/1e9).toFixed(1)+' MM' : a>=1e6? (a/1e6).toFixed(1)+' M' : a>=1e3? Math.round(a/1e3)+' K' : Math.round(a); return (n<0?'-':'')+'$'+s; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
function hashId(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');}

function toast(msg, ms=2600){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
const normRut = r => String(r||'').toUpperCase().replace(/[^0-9K]/g,'');
const normTxt = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function dvRut(num){ let s=0,m=2; for(let i=num.length-1;i>=0;i--){ s+= +num[i]*m; m = m===7?2:m+1; } const r = 11-(s%11); return r===11?'0': r===10?'K': String(r); }
function rutValido(r){ const n = normRut(r); if(n.length<2) return false; const cuerpo=n.slice(0,-1), dv=n.slice(-1); return /^\d+$/.test(cuerpo) && dvRut(cuerpo)===dv; }
function fmtRut(r){ const n = normRut(r); if(n.length<2) return String(r||''); const c=n.slice(0,-1), dv=n.slice(-1); return c.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv; }

function parseMonto(v){
  if(v==null || v==='') return null;
  if(typeof v==='number') return Math.round(v);
  let s = String(v).trim(); const neg = /^\(.*\)$/.test(s) || /^-/.test(s);
  s = s.replace(/[^\d,\.]/g,''); if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); if(isNaN(n)) return null; return Math.round(neg? -n : n);
}
function parseFecha(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return ymd(v);
  if(typeof v==='number' && v>20000 && v<80000){ const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return null;
}

    try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('Persistencia offline no disponible', e.code); }
    return new Promise(res => {

  subscribe(){

    const cols = esSupervisor() ? ['empresas','auxiliares','movimientos'] : COLS.concat(Sess.rol==='admin'?['usuarios']:[]);
    cols.forEach(c => {
      let q = this.db.collection(PFX+c);

        scheduleRender();
      }, err => { console.error(err); toast('Error de lectura: '+err.message, 5000); });
      this.unsub.push(f);
    });
  },
  async putMany(col, arr){
    if(!arr.length) return;
    arr.forEach(o => { if(!o.id) o.id = uid(); o.upd = Date.now(); });
    if(this.mode==='local'){
      const map = new Map(this.data[col].map(o=>[o.id,o]));
      arr.forEach(o => map.set(o.id, {...o}));
      this.data[col] = [...map.values()]; this.saveLocal(); scheduleRender(); return;
    }
    for(let i=0;i<arr.length;i+=400){
      const b = this.db.batch();
      arr.slice(i,i+400).forEach(o => { const {id,...rest} = o; b.set(this.db.collection(PFX+col).doc(id), clean(rest)); });
      await b.commit();
    }
  },
  put(col, o){ return this.putMany(col,[o]); },
  async delMany(col, ids){
    if(!ids.length) return;
    if(this.mode==='local'){ const s=new Set(ids); this.data[col] = this.data[col].filter(o=>!s.has(o.id)); this.saveLocal(); scheduleRender(); return; }
    for(let i=0;i<ids.length;i+=400){
      const b = this.db.batch(); ids.slice(i,i+400).forEach(id => b.delete(this.db.collection(PFX+col).doc(id))); await b.commit();
    }
  },
  del(col,id){ return this.delMany(col,[id]); },
};

function buscarAux(q, tipo){
  const L = Store.data.auxiliares.filter(a => !tipo || a.tipo===tipo || a.tipo==='ambos');
  const nq = normTxt(q).trim(); const nr = normRut(q); const esRut = /\d{2,}/.test(q);
  if(!nq) return [...L].sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,30);
  const ws = nq.split(/\s+/);
  const res = [];
  L.forEach(a => {
    const nn = normTxt(a.nombre), ar = normRut(a.rut); let sc = -1;
    if(esRut && nr && ar.startsWith(nr)) sc = 0;
    else if(esRut && nr.length>=3 && ar.includes(nr)) sc = 1;
    else if(nn.startsWith(nq)) sc = 2;
    else if(ws.every(w=>nn.includes(w))) sc = 3;
    if(sc>=0) res.push([sc,a]);
  });
  return res.sort((x,y)=>x[0]-y[0] || x[1].nombre.localeCompare(y[1].nombre)).slice(0,30).map(x=>x[1]);
}
/* agrega/actualiza auxiliares a partir de [{rut,nombre,tipo}] */
async function upsertAux(lista){
  const map = new Map(Store.data.auxiliares.map(a=>[a.id,{...a}])); const cambios = new Map();
  lista.forEach(({rut,nombre,tipo}) => {
    const n = normRut(rut); if(n.length<2) return;
    const id = 'a_'+n; const x = map.get(id);
    if(!x){ const o = {id, rut:fmtRut(n), nombre:String(nombre||'').trim() || fmtRut(n), tipo}; map.set(id,o); cambios.set(id,o); return; }
    let ch = false;
    if(x.tipo!==tipo && x.tipo!=='ambos'){ x.tipo='ambos'; ch=true; }
    if((!x.nombre || x.nombre===x.rut) && nombre){ x.nombre=String(nombre).trim(); ch=true; }
    if(ch) cambios.set(id,x);
  });
  await Store.putMany('auxiliares', [...cambios.values()]);
  return cambios.size;
}

function periodos(gran, n){
  const res=[]; const t = today();
  let ini;
  if(gran==='sem'){ const d=pDate(t); const dow=(d.getDay()+6)%7; ini = addDays(t,-dow); }
  else ini = t.slice(0,8)+'01';
  for(let i=0;i<n;i++){
    let fin, label;
    if(gran==='sem'){ fin = addDays(ini,6); const d=pDate(ini); label = `${pad(d.getDate())}-${MES[d.getMonth()]}`; }
    else if(gran==='dia'){ fin = ini; const d=pDate(ini); label = `${pad(d.getDate())}-${MES[d.getMonth()]}`; }
    else { fin = addDays(addMonths(ini,1),-1); const d=pDate(ini); label = `${MES[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; }
    res.push({ini, fin, label});
    ini = addDays(fin,1);
  }
  return res;
}
function calcFlujo(empSel, ctaSel, gran, n){
  const t = today();
  let ini = gran==='dia'? t : null;
  const pers = gran==='dia' ? (()=>{const r=[];let d=t;for(let i=0;i<n;i++){const x=pDate(d);r.push({ini:d,fin:d,label:`${pad(x.getDate())}-${MES[x.getMonth()]}`});d=addDays(d,1);}return r;})() : periodos(gran,n);
  const cols = [{ini:'0000-00-00', fin:addDays(t,-1), label:'Vencido', venc:true}, ...pers];
  const ctas = Store.data.cuentas.filter(c => (empSel==='*' || c.empresaId===empSel) && (ctaSel==='*' || c.id===ctaSel));
  const saldoIni = ctas.reduce((s,c)=>s+saldoTeorico(c.id).teorico,0);

function filtrarMov(){
  const f = UI.mov; const q = f.q.trim().toLowerCase();
  return Store.data.movimientos.filter(m =>
    (UI.emp==='*' || m.empresaId===UI.emp) && (f.cta==='*' || m.cuentaId===f.cta || (f.cta==='-' && !m.cuentaId)) &&
    (f.origen==='*' || m.origen===f.origen) &&
    (f.estado==='*' || (f.estado==='pend' ? m.estado!=='pagado' : m.estado==='pagado')) &&
    (!f.desde || fEf(m)>=f.desde) && (!f.hasta || fEf(m)<=f.hasta) &&
    (!q || [m.contraparte,m.rut,m.folio,m.glosa,m.categoria,m.tipoDoc].join(' ').toLowerCase().includes(q) || (/\d{4}/.test(q) && normRut(m.rut).includes(normRut(q))))
  ).sort((a,b)=>fEf(a).localeCompare(fEf(b)));
}

      <td data-l="Contraparte" style="white-space:normal;min-width:160px">${esc(m.contraparte||'')}${m.rut?` <span class="small muted">${esc(m.rut)}</span>`:''}</td>
      <td data-l="Doc">${esc([m.tipoDoc,m.folio].filter(Boolean).join(' '))}${m.cuota?` <span class="small muted">${esc(m.cuota)}</span>`:''}${m.origen==='forestal'? ` <span class="small muted">${esc(resumenNeg(m))}</span>` : m.glosa?` <span class="small muted">${esc(m.glosa)}</span>`:''}</td>

  }).join('');
  return `<div class="tw" style="max-height:65vh"><table class="cards"><thead><tr>${selectable?`<th><input type="checkbox" onchange="selTodos(this.checked)"></th>`:''}<th>Fecha</th>${UI.emp==='*'?'<th>Empresa</th>':''}<th>Cuenta</th><th>Origen</th><th>Categoría</th><th>Contraparte</th><th>Documento / glosa</th><th class="n">Monto</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="10" class="muted">Sin movimientos</td></tr>'}</tbody></table></div>
  ${ms.length>lim?`<p class="small muted">Mostrando ${lim} de ${ms.length}. Usa los filtros para acotar.</p>`:''}`;
}

let _db; function debRender(){ clearTimeout(_db); _db=setTimeout(()=>{ const p=document.activeElement; const pos=p?.selectionStart; render(); const i=document.querySelector('input[placeholder^="Contraparte"]'); if(i){i.focus(); try{i.setSelectionRange(pos,pos);}catch(e){}} },250); }
function selMov(id,on){ on? UI.mov.sel.add(id) : UI.mov.sel.delete(id); render(); }
function selTodos(on){ filtrarMov().slice(0,600).forEach(m=> on? UI.mov.sel.add(m.id): UI.mov.sel.delete(m.id)); render(); }
async function bulk(acc){
  const ids = new Set(UI.mov.sel); const ms = Store.data.movimientos.filter(m=>ids.has(m.id));
  if(!ms.length) return;
  if(acc==='borrar'){ if(!confirm(`¿Eliminar ${ms.length} movimientos?`)) return; await Store.delMany('movimientos', ms.map(m=>m.id)); UI.mov.sel.clear(); toast('Eliminados'); return; }
  if(acc==='pagado'){ pagarMovs(ms.map(m=>m.id)); return; }
  if(acc==='pendiente'){ await revertirPago(ms.map(m=>m.id)); return; }
  if(acc==='cuenta'){
    const emps = new Set(ms.map(m=>m.empresaId));
    if(emps.size>1){ alert('Selecciona movimientos de una sola empresa para asignar cuenta.'); return; }
    const eid=[...emps][0];
    modal(`<h3>Asignar cuenta a ${ms.length} movimientos</h3><select id="bkC" style="width:100%">${cuentasDe(eid).map(c=>`<option value="${c.id}">${esc(cuentaLabel(c))}</option>`).join('')}</select>
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="bkOk">Asignar</button></div>`);
    $('#bkOk').onclick = async()=>{ const c=$('#bkC').value; await Store.putMany('movimientos', ms.map(m=>({...m, cuentaId:c, cuentaManual:true}))); closeModal(); UI.mov.sel.clear(); toast('Cuenta asignada'); };
    return;
  }
  if(acc==='fecha'){
    modal(`<h3>Reprogramar ${ms.length} movimientos</h3><p class="small muted">Se conserva la fecha de vencimiento original; la nueva fecha es la que usa el flujo y no se pisa al reimportar.</p><input type="date" id="bkF" value="${today()}" style="width:100%">
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" id="bkR">Volver a vencimiento original</button><button class="btn pri" id="bkOk">Reprogramar</button></div>`);
    $('#bkOk').onclick = async()=>{ const f=$('#bkF').value; if(!f) return; await Store.putMany('movimientos', ms.map(m=>({...m, fechaProg:f}))); closeModal(); UI.mov.sel.clear(); toast('Reprogramado'); };
    $('#bkR').onclick = async()=>{ await Store.putMany('movimientos', ms.map(m=>({...m, fechaProg:null}))); closeModal(); UI.mov.sel.clear(); toast('Fechas restauradas'); };
  }
}

async function guardarMov(id){
  const g = s => $(s)?.value;
  const base = { empresaId:g('#mE'), cuentaId:g('#mC')||null, fecha:g('#mF'), monto:Math.round(+g('#mM')||0), contraparte:g('#mP').trim(), glosa:g('#mG').trim() };
  if(!base.fecha || !base.monto){ toast('Fecha y monto son obligatorios'); return; }
  const tSel = g('#mT'), catSel = g('#mK');
  if(!window._movImp && tSel!=='traspaso' && esDocCat(catSel)){
    const a = _auxSel && aux(_auxSel); const quien = catSel===CAT_CXC?'cliente':'proveedor';
    if(!a){ toast(`Selecciona el ${quien} desde el buscador (o créalo)`); $('#mAux').focus(); return; }
    const folio = g('#mFo').trim(); if(!folio){ toast('Ingresa el N° de documento'); $('#mFo').focus(); return; }
    Object.assign(base, {auxId:a.id, rut:a.rut, contraparte:a.nombre, tipoDoc:g('#mTD'), folio});
    const k = claveMov({...base, tipo:tSel, categoria:catSel});
    const dup = Store.data.movimientos.find(x => x.id!==id && claveMov(x)===k);
    if(dup){ alert(`No se puede duplicar: el documento ${dup.tipoDoc||''} N° ${folio} de ${a.nombre} ya está ingresado (${fmt(dup.monto)}, vence ${fDate(dup.fecha)}, ${dup.estado}).`); return; }
  }
  if(id){
    const m = Store.data.movimientos.find(x=>x.id===id);
    const nm = {...m, ...base, tipo:g('#mT'), categoria:g('#mK'), fechaProg:g('#mFP')||null, estado:g('#mS')};
    if(m.cuentaId!==nm.cuentaId) nm.cuentaManual = true;
    nm.fechaPago = nm.estado==='pagado' ? (g('#mFPag') || today()) : null;
    if(nm.fechaPago && nm.fechaPago>today()){ toast('La fecha de pago no puede ser futura'); return; }
    await Store.put('movimientos', nm); closeModal(); toast('Guardado'); return;
  }
  const n = Math.max(1, +g('#mN')||1), fr = g('#mR'); const grupo = n>1? uid(): null;
  const fechaN = i => fr==='m'? addMonths(base.fecha,i) : fr==='t'? addMonths(base.fecha,3*i) : fr==='a'? addMonths(base.fecha,12*i) : addDays(base.fecha, (fr==='s'?7:14)*i);
  const out = [];
  if(g('#mT')==='traspaso'){
    const dest = cuenta(g('#mD')); if(!dest || !base.cuentaId){ toast('Elige cuenta origen y destino'); return; }
    if(dest.id===base.cuentaId){ toast('Origen y destino son la misma cuenta'); return; }
    const cruzado = dest.empresaId!==base.empresaId; const cat = cruzado? 'Préstamo empresa relacionada':'Traspaso entre cuentas';
    for(let i=0;i<n;i++){
      const tg = uid(); const f = fechaN(i); const cu = n>1? `${i+1}/${n}`:null;
      out.push({...base, id:uid(), fecha:f, tipo:'egreso', categoria:cat, origen:'manual', estado:'pendiente', grupo, traspaso:tg, cuota:cu, contraparte: base.contraparte || (empresa(dest.empresaId)?.nombre+' · '+cuentaLabel(dest))});
      out.push({...base, id:uid(), fecha:f, empresaId:dest.empresaId, cuentaId:dest.id, tipo:'ingreso', categoria:cat, origen:'manual', estado:'pendiente', grupo, traspaso:tg, cuota:cu, contraparte: empresa(base.empresaId)?.nombre+' · '+cuentaLabel(cuenta(base.cuentaId))});
    }
  } else {
    for(let i=0;i<n;i++) out.push({...base, id:uid(), fecha:fechaN(i), tipo:g('#mT'), categoria:g('#mK'), origen:'manual', estado:'pendiente', grupo, cuota: n>1? `${i+1}/${n}`:null});
  }
  if(window._nuevoPagado){ const fp = window._nuevoPagado; out.forEach(o=>{ o.estado='pagado'; o.fechaPago=fp; }); }
  window._nuevoPagado = null;
  await Store.putMany('movimientos', out); closeModal(); toast(`${out.length} movimiento(s) creados`);
}
async function borrarMov(id){
  const m = Store.data.movimientos.find(x=>x.id===id);
  const ids = m.traspaso? Store.data.movimientos.filter(x=>x.traspaso===m.traspaso).map(x=>x.id) : [id];
  if(!confirm(ids.length>1? 'Se eliminará el traspaso completo (egreso e ingreso). ¿Continuar?' : '¿Eliminar este movimiento?')) return;
  await Store.delMany('movimientos', ids); closeModal(); toast('Eliminado');
}
async function borrarGrupo(g){

  if(!confirm(`¿Eliminar las ${ids.length} cuotas pendientes de esta serie?`)) return;

}

const CAMPOS = [
  ['tipo','Tipo (INGRESO / EGRESO)',[/^tipo$/,/ingreso.*egreso|^movimiento$/]],
  ['tipoDoc','Documento (FACTURA, REMUNERACIONES…)',[/^documento$/,/tipo.*doc/,/^doc$/]],
  ['folio','N° documento',[/n[uú]mero.*doc/,/folio/,/n[uú]m/,/n[°º]/,/^nro/]],
  ['emision','Fecha de emisión',[/emisi/]],
  ['fecha','Fecha de vencimiento *',[/venc/,/fecha.*pago/,/^fecha$/]],
  ['rut','RUT',[/rut/]],
  ['contraparte','Auxiliar / razón social',[/auxiliar/,/raz[oó]n/,/nombre/,/proveedor/,/cliente/]],
  ['monto','Importe *',[/importe/,/saldo/,/monto/,/total/]],
  ['cuenta','Cuenta bancaria (opcional)',[/cuenta.*(cte|corr|banc)/,/banco/]],
  ['glosa','Glosa (opcional)',[/glosa/,/detalle/,/descrip/,/observ/]],
];
/* tipos de documento tributario -> código; lo demás se trata como categoría del flujo */
const DOC_MAP = [[/nota.*cr[eé]d|^n\.?\s?c\.?$/i,'NC'],[/nota.*d[eé]b|^n\.?\s?d\.?$/i,'ND'],[/exent/i,'FEX'],[/^fact|^fac$|^fe$|^fa$|factura/i,'FAC'],[/boleta|^bol$/i,'BOL'],[/gu[ií]a|^gd$/i,'GD']];
function codDoc(s){ const t = String(s||'').trim(); if(!t) return null; if(TIPOS_DOC.some(x=>x[0]===t.toUpperCase())) return t.toUpperCase(); for(const [re,c] of DOC_MAP) if(re.test(t)) return c; return null; }
const CAT_MAP = [[/remuner|sueldo|liquidaci/i,'Remuneraciones'],[/imposic|previred|afp|isapre/i,'Imposiciones'],[/impuest|f\s?29|f\s?22|\biva\b|ppm/i,'Impuestos (F29 / F22)'],[/leasing/i,'Leasing'],
  [/cuota|cr[eé]dito|pr[eé]stamo/i,'Cuota crédito bancario'],[/cr[eé]dito|pr[eé]stamo/i,'Crédito bancario (desembolso)'],[/l[ií]nea/i,'Línea de crédito (abono)'],[/l[ií]nea/i,'Línea de crédito (giro)'],
  [/arriendo/i,'Arriendos'],[/retiro/i,'Retiro de socios'],[/aporte/i,'Aporte de socios'],[/relacionad/i,'Préstamo empresa relacionada'],[/traspaso/i,'Traspaso entre cuentas']];
function catDe(s, tipo){ for(const [re,c] of CAT_MAP) if(re.test(s) && CATEGORIAS[tipo].includes(c)) return c; return tipo==='ingreso'?'Otros ingresos':'Otros egresos'; }
/* clave única de un movimiento: documentos por RUT + tipo doc + número; el resto por categoría + RUT + vencimiento */
function claveMov(m){
  const folio = String(m.folio??'').trim().replace(/^0+(?=\d)/,'');
  if(esDocCat(m.categoria) && folio) return ['D', m.empresaId, m.tipo, normRut(m.rut), codDoc(m.tipoDoc)||String(m.tipoDoc||'').toUpperCase(), folio].join('|');
  return ['M', m.empresaId, m.tipo, m.categoria, normRut(m.rut), m.fecha].join('|');
}

function impPreview(){
  const st = UI.imp; const m = st.map; const emp = st.emp || $('#iE')?.value; st.emp = emp;
  const ctas = cuentasDe(emp); const def = ctas.find(c=>c.porDefecto) || ctas[0];
  const matchCta = v => { const s = String(v||'').toLowerCase().replace(/[^a-z0-9]/g,''); if(!s) return null; return ctas.find(c => { const n=String(c.numero||'').replace(/[^0-9]/g,''); return (n && s.includes(n)) || (c.alias && s===c.alias.toLowerCase().replace(/[^a-z0-9]/g,'')); }); };
  // índice de lo ya ingresado en esta empresa (todas las fuentes y estados)
  const exIdx = new Map(); Store.data.movimientos.filter(x=>x.empresaId===emp && !x.traspaso).forEach(x => exIdx.set(claveMov(x), x));
  const filas = [], seen = new Map();
  st.rows.slice(st.head+1).forEach((r,ix) => {
    if(!r.some(v=>v!=='' && v!=null)) return;
    const nFila = st.head+ix+2;
    const get = k => m[k]==null? '' : r[m[k]];
    const txtDoc = String(get('tipoDoc')||'').trim();
    const contraparte = String(get('contraparte')||'').trim();
    const f = {fila:nFila, txtDoc, contraparte, rut:String(get('rut')||'').trim(), folio:String(get('folio')??'').trim()};
    if(/^total/i.test(String(r.find(v=>v!=='')||''))) return;
    // tipo
    let tipo = st.origen==='cxc'?'ingreso': st.origen==='cxp'?'egreso':null;
    if(st.origen==='auto'){ const t = normTxt(get('tipo')).trim(); tipo = /^ing|^abono|^entrada/.test(t)?'ingreso': /^egr|^cargo|^salida|^pago/.test(t)?'egreso':null; }
    f.tipo = tipo;
    let monto = parseMonto(get('monto')); const fecha = parseFecha(get('fecha'));
    f.fecha = fecha; f.monto = monto;
    const errs = [];
    if(!tipo) errs.push('TIPO debe ser INGRESO o EGRESO');
    if(fecha==null) errs.push('vencimiento no válido');
    if(monto==null || monto===0) errs.push('sin importe');
    const cod = codDoc(txtDoc);
    const esDoc = !!cod || (!txtDoc && !!f.folio);
    if(esDoc && !f.folio) errs.push('documento sin número');
    if(f.rut && normRut(f.rut).length>1 && !rutValido(f.rut)) f.rutMalo = true;
    if(errs.length){ f.estado='error'; f.msg = errs.join(', '); filas.push(f); return; }
    if(cod==='NC' && monto>0) monto = -monto;
    const categoria = esDoc ? (tipo==='ingreso'?CAT_CXC:CAT_CXP) : catDe(txtDoc, tipo);
    const cta = m.cuenta!=null ? matchCta(get('cuenta')) : null;
    const doc = { empresaId:emp, tipo, categoria, origen: esDoc ? (tipo==='ingreso'?'cxc':'cxp') : 'imp',
      fecha, monto, contraparte, rut: f.rut? fmtRut(f.rut) : '', tipoDoc: esDoc ? (cod||'FAC') : '', docTxt: txtDoc, folio: esDoc? f.folio.replace(/^0+(?=\d)/,'') : '',
      emision: parseFecha(get('emision')), glosa: String(get('glosa')||'').trim() || (!esDoc && txtDoc && categoria.startsWith('Otros') ? txtDoc : ''),
      auxId: esDoc && normRut(f.rut).length>1 ? auxId(f.rut) : null, _cta: cta?.id || def?.id || null, _ctaExcel: !!cta };
    const k = claveMov(doc); doc.id = 'd_'+hashId(k); f.doc = doc; f.clave = k; Object.assign(f, {categoria, monto});
    if(seen.has(k)){ f.estado='dupArchivo'; f.msg = `repite la fila ${seen.get(k)}`; filas.push(f); return; }
    seen.set(k, nFila);
    const x = exIdx.get(k);
    if(x){ f.existe = x; const dif = x.monto!==monto || x.fecha!==fecha; f.estado = dif? 'cambia':'existe';
      const org = `${ORIGEN_LBL[x.origen]||x.origen}${x.estado==='pagado'?' · pagado':''}`;

    else f.estado = 'nuevo';
    filas.push(f);
  });
  const by = e => filas.filter(f=>f.estado===e);
  const claves = new Set(filas.filter(f=>f.clave).map(f=>f.clave));
  const tiposArchivo = new Set(filas.filter(f=>f.doc && f.doc.origen!=='imp').map(f=>f.doc.origen));
  const cerrar = Store.data.movimientos.filter(x=>x.empresaId===emp && tiposArchivo.has(x.origen) && x.estado!=='pagado' && !claves.has(claveMov(x)));
  st.prev = {filas, nuevos:by('nuevo'), existe:by('existe'), cambia:by('cambia'), dupArch:by('dupArchivo'), errores:by('error'), cerrar,
    updOk: st.prev?.updOk ?? false, cerrarOk: st.prev?.cerrarOk ?? false, ver: st.prev?.ver || 'todos'};
  render();
}

/* =====================================================================
   SALDO TEÓRICO Y CONCILIACIÓN BANCARIA
   Saldo teórico = último saldo real ingresado + pagos/cobros dados por pagados después de esa fecha.
   Cada saldo real se contrasta con el teórico a su fecha (saldo real anterior + pagos del período).
   ===================================================================== */
function saldosDe(cid){
  const L = Store.data.saldos.filter(s=>s.cuentaId===cid).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!L.length){ const c = cuenta(cid); if(c && c.fechaSaldo) return [{id:'v_'+cid, cuentaId:cid, fecha:c.fechaSaldo, saldo:+c.saldo||0, virtual:true}]; }
  return L;
}
const pagosCuenta = (cid, desde, hasta) => Store.data.movimientos.filter(m => m.estado==='pagado' && m.cuentaId===cid && m.fechaPago && (desde==null || m.fechaPago>desde) && m.fechaPago<=hasta);
function saldoTeorico(cid, fecha){
  fecha = fecha || today();
  const L = saldosDe(cid).filter(s=>s.fecha<=fecha); const base = L[L.length-1] || null;
  const p = pagosCuenta(cid, base?.fecha ?? null, fecha);
  const ing = p.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+m.monto,0), egr = p.filter(m=>m.tipo==='egreso').reduce((s,m)=>s+m.monto,0);
  return {base, pagos:p, ing, egr, teorico:(base?.saldo||0) + ing - egr};
}
/* controles de una cuenta con su diferencia (calculada en vivo: si luego se marcan pagos con fecha del período, la diferencia se corrige) */
function controles(cid){
  const L = saldosDe(cid);
  return L.map((s,i) => {
    if(i===0) return {...s, inicial:true, teorico:null, dif:0};
    const prev = L[i-1]; const p = pagosCuenta(cid, prev.fecha, s.fecha);
    const teo = prev.saldo + p.reduce((a,m)=>a+efecto(m),0);
    return {...s, prev, pagos:p, teorico:teo, dif: s.saldo - teo};
  });
}
const diasDesde = f => f ? Math.round((pDate(today()) - pDate(f))/864e5) : null;

function pagarMovs(ids){
  const ms = Store.data.movimientos.filter(m=>ids.includes(m.id) && m.estado!=='pagado');
  if(!ms.length){ toast('No hay compromisos pendientes seleccionados'); return; }
  const emps = new Set(ms.map(m=>m.empresaId)); const eid = emps.size===1? [...emps][0] : null;

  modal(`<h3>Dar por pagado · ${ms.length} compromiso(s)</h3>
    <p class="small muted">Neto ${fmt(tot)}. Lo pagado sale del flujo proyectado y pasa a mover el <b>saldo teórico</b> de la cuenta en la fecha de pago.</p>

        <option value="fija">Una fecha para todos</option><option value="venc">Fecha de vencimiento de cada uno (si es futura, hoy)</option></select></label>

    </div>
    ${!eid?'<p class="small muted">Seleccionaste varias empresas: se usa la cuenta asignada a cada compromiso (o la cuenta por defecto de su empresa).</p>':''}
    <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="pgOk">Dar por pagado</button></div>`);
  $('#pgOk').onclick = async () => {
    const modo = $('#pgModo').value, ff = $('#pgF').value, cSel = $('#pgC').value;
    if(modo==='fija' && (!ff || ff>today())){ toast('La fecha de pago no puede ser futura'); return; }
    const out = []; const sinCta = [];
    const addPago = (m, fp, cid) => out.push({...m, estado:'pagado', fechaPago:fp, cuentaId:cid, ...(cid!==m.cuentaId?{cuentaManual:true}:{})});
    ms.forEach(m => {
      const fp = modo==='fija' ? ff : (fEf(m) > today() ? today() : fEf(m));
      const def = cuentasDe(m.empresaId).find(c=>c.porDefecto) || cuentasDe(m.empresaId)[0];
      const cid = (cSel && !m.traspaso) ? cSel : (m.cuentaId || def?.id || null);
      if(!cid) sinCta.push(m);
      addPago(m, fp, cid);
      if(m.traspaso) Store.data.movimientos.filter(x=>x.traspaso===m.traspaso && x.id!==m.id && x.estado!=='pagado' && !ids.includes(x.id)).forEach(x=>addPago(x, fp, x.cuentaId));
    });
    if(sinCta.length && !confirm(`${sinCta.length} compromiso(s) no tienen cuenta bancaria: se darán por pagados pero no moverán ningún saldo teórico. ¿Continuar?`)) return;
    await Store.putMany('movimientos', out); UI.mov.sel.clear(); closeModal(); toast(`${out.length} compromiso(s) pagados`);
    if(window._trasPago) { const f=window._trasPago; window._trasPago=null; f(); }
  };
}

    <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarSaldo('${cid}')">Guardar saldo</button></div>`);
  srCalc(cid); setTimeout(()=>$('#srS')?.focus(),50);
}
function srCalc(cid){
  const f = $('#srF').value, v = $('#srS').value; const el = $('#srRes'); if(!el || !f) return;
  const L = saldosDe(cid).filter(s=>s.fecha<f); const prev = L[L.length-1];
  if(!prev){ el.innerHTML = `<div class="banner info">Será el <b>saldo inicial</b> de la cuenta: desde aquí se calcula el saldo teórico.</div>`; return; }
  const p = pagosCuenta(cid, prev.fecha, f); const teo = prev.saldo + p.reduce((a,m)=>a+efecto(m),0);
  const dif = v===''? null : Math.round(+v) - teo;
  el.innerHTML = `<div class="kpis" style="margin:0">
    <div class="kpi" style="min-height:0"><div class="l">Saldo real anterior</div><div class="v" style="font-size:18px">${fmt(prev.saldo)}</div><div class="s">al ${fDate(prev.fecha)}</div></div>
    <div class="kpi" style="min-height:0"><div class="l">Movimientos pagados</div><div class="v" style="font-size:18px">${fmt(teo-prev.saldo)}</div><div class="s">${p.length} registro(s) en el período</div></div>
    <div class="kpi" style="min-height:0"><div class="l">Saldo teórico</div><div class="v" style="font-size:18px">${fmt(teo)}</div><div class="s">al ${fDate(f)}</div></div>
    <div class="kpi" style="min-height:0"><div class="l">Diferencia</div><div class="v ${dif? 'neg':'pos'}" style="font-size:18px">${dif==null?'-': dif? fmt(dif):'Cuadrado'}</div><div class="s">${dif==null?'Ingresa el saldo real': dif? (dif<0?'Faltan egresos por registrar o marcar':'Faltan ingresos por registrar o marcar') : 'Sin diferencias'}</div></div></div>`;
}
async function guardarSaldo(cid){
  const f = $('#srF').value, v = $('#srS').value;
  if(!f || f>today()){ toast('Fecha no válida'); return; }
  if(v===''){ toast('Ingresa el saldo real'); return; }
  const saldo = Math.round(+v); const c = cuenta(cid);
  const L = saldosDe(cid).filter(s=>s.fecha<f); const prev = L[L.length-1];
  const teo = prev ? prev.saldo + pagosCuenta(cid, prev.fecha, f).reduce((a,m)=>a+efecto(m),0) : null;
  await Store.put('saldos', {id: cid+'_'+f, cuentaId:cid, empresaId:c.empresaId, fecha:f, saldo, teoricoAlIngresar:teo, nota:$('#srN').value.trim(), usuario: Store.user?.email||'local', creado:new Date().toISOString()});
  const ultimo = saldosDe(cid).filter(s=>!s.virtual).pop();
  if(!c.fechaSaldo || f>=c.fechaSaldo || (ultimo && ultimo.fecha===f)) await Store.put('cuentas', {...c, saldo, fechaSaldo:f});
  closeModal();
  const dif = teo==null? 0 : saldo - teo;
  toast(teo==null? 'Saldo inicial registrado' : dif? `Diferencia de ${fmt(dif)}: revisa el análisis` : 'Cuenta cuadrada');
  if(dif) setTimeout(()=>analisisDif(cid, f), 200);
}
function historialCta(cid){

  modal(`<h3>Historial de conciliación · ${esc(cuentaLabel(c))}</h3>

    ${cs.map(s=>`<tr><td data-l="Fecha">${fDate(s.fecha)}</td><td class="n" data-l="Saldo real">${fmt(s.saldo)}</td><td class="n" data-l="Teórico">${s.inicial?'<span class="muted">saldo inicial</span>':fmt(s.teorico)}</td>
      <td class="n ${s.dif?'neg':'pos'}" data-l="Diferencia">${s.inicial?'-': s.dif? fmt(s.dif):'Cuadrado'}</td><td data-l="Nota" class="small muted">${esc(s.nota||'')}${s.virtual?'saldo de la ficha de la cuenta':''}</td>
      <td>${!s.inicial?`<button class="btn sm" onclick="analisisDif('${cid}','${s.fecha}')">Analizar</button>`:''} ${!s.virtual&&puedeEscribir()?`<button class="btn sm dan" onclick="borrarSaldo('${s.id}','${cid}')">Eliminar</button>`:''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Sin saldos ingresados</td></tr>'}
    </tbody></table></div>

async function borrarSaldo(id, cid){ if(!confirm('¿Eliminar este saldo real?')) return; await Store.del('saldos', id); const u = saldosDe(cid).filter(s=>!s.virtual).pop(); if(u) await Store.put('cuentas',{...cuenta(cid), saldo:u.saldo, fechaSaldo:u.fecha}); historialCta(cid); }
function analisisDif(cid, fecha){
  const c = cuenta(cid); const ctrl = controles(cid).find(s=>s.fecha===fecha); if(!ctrl || ctrl.inicial) return;
  const dif = ctrl.dif; const signo = dif<0 ? 'egreso' : 'ingreso';
  // candidatos: pendientes de la empresa con fecha hasta el cierre, en esta cuenta o sin cuenta
  const cand = Store.data.movimientos.filter(m => m.estado!=='pagado' && m.empresaId===c.empresaId && (m.cuentaId===cid || !m.cuentaId) && fEf(m)<=fecha)
    .map(m => ({m, exacto: Math.abs(efecto(m) - dif) < 1, mismoSigno: m.tipo===signo}))
    .sort((a,b)=> (b.exacto-a.exacto) || (b.mismoSigno-a.mismoSigno) || fEf(a.m).localeCompare(fEf(b.m)));
  const pagos = ctrl.pagos || [];
  modal(`<h3>Análisis de diferencia · ${esc(cuentaLabel(c))} · ${fDate(fecha)}</h3>
    <div class="kpis">
      <div class="kpi" style="min-height:0"><div class="l">Saldo real</div><div class="v" style="font-size:18px">${fmt(ctrl.saldo)}</div></div>
      <div class="kpi" style="min-height:0"><div class="l">Saldo teórico</div><div class="v" style="font-size:18px">${fmt(ctrl.teorico)}</div><div class="s">${fmt(ctrl.prev.saldo)} al ${fDate(ctrl.prev.fecha)} + ${pagos.length} pagos</div></div>
      <div class="kpi" style="min-height:0"><div class="l">Diferencia</div><div class="v ${dif?'neg':'pos'}" style="font-size:18px">${dif?fmt(dif):'Cuadrado'}</div><div class="s">${dif<0?'El banco tiene menos: egresos sin registrar o sin marcar':dif>0?'El banco tiene más: ingresos sin registrar o sin marcar':''}</div></div>
    </div>
    ${dif?`<h3 style="font-size:14px;margin:14px 0 6px">Compromisos pendientes con fecha hasta el ${fDate(fecha)} (posibles pagos no marcados)</h3>
    <p class="small muted">Marca los que ya pasaron por el banco y dalos por pagados con fecha dentro del período: la diferencia se recalcula. ★ = importe igual a la diferencia.</p>
    <div class="tw" style="max-height:260px"><table class="cards"><thead><tr><th></th><th>Fecha</th><th>Categoría</th><th>Contraparte</th><th>Documento</th><th class="n">Efecto</th></tr></thead><tbody>
    ${cand.slice(0,200).map(({m,exacto,mismoSigno})=>`<tr style="${exacto?'background:#fff8d6':''}"><td><input type="checkbox" class="adSel" value="${m.id}"></td><td data-l="Fecha">${fDate(fEf(m))}</td><td data-l="Categoría">${esc(m.categoria)}</td>
      <td data-l="Contraparte" style="white-space:normal">${exacto?'★ ':''}${esc(m.contraparte||'')}</td><td data-l="Doc">${esc([m.tipoDoc,m.folio].filter(Boolean).join(' '))}</td>
      <td class="n ${m.tipo==='ingreso'?'pos':'neg'} ${mismoSigno?'':'muted'}" data-l="Efecto">${fmt(efecto(m))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No hay compromisos pendientes con fecha en el período: la diferencia corresponde a documentos no registrados.</td></tr>'}
    </tbody></table></div>`:''}
    <details style="margin-top:12px"><summary class="small">Pagos registrados en el período (${pagos.length})</summary>
    <div class="tw" style="max-height:220px;margin-top:6px"><table><tbody>${pagos.sort((a,b)=>a.fechaPago.localeCompare(b.fechaPago)).map(m=>`<tr><td>${fDate(m.fechaPago)}</td><td>${esc(m.categoria)}</td><td>${esc(m.contraparte||'')}</td><td>${esc([m.tipoDoc,m.folio].filter(Boolean).join(' '))}</td><td class="n ${m.tipo==='ingreso'?'pos':'neg'}">${fmt(efecto(m))}</td></tr>`).join('') || '<tr><td class="muted">Sin pagos</td></tr>'}</tbody></table></div></details>
    <div class="actions">
      <button class="btn" onclick="closeModal()">Cerrar</button>
      ${dif&&puedeEscribir()?`<button class="btn" onclick="faltante('${cid}','${fecha}',${dif})">Registrar documento faltante</button>
      <button class="btn pri" onclick="adPagar('${cid}','${fecha}')">Dar por pagados los marcados</button>`:''}
    </div>`, true);
}
async function adPagar(cid, fecha){
  const ids = [...document.querySelectorAll('.adSel:checked')].map(x=>x.value);
  if(!ids.length){ toast('Marca al menos un compromiso'); return; }
  const ms = Store.data.movimientos.filter(m=>ids.includes(m.id));
  const out = ms.map(m=>({...m, estado:'pagado', fechaPago: fEf(m)>fecha? fecha : fEf(m), cuentaId:cid, ...(m.cuentaId!==cid?{cuentaManual:true}:{})}));
  ms.filter(m=>m.traspaso).forEach(m=>Store.data.movimientos.filter(x=>x.traspaso===m.traspaso && x.id!==m.id && x.estado!=='pagado').forEach(x=>out.push({...x, estado:'pagado', fechaPago: out.find(o=>o.id===m.id).fechaPago})));
  await Store.putMany('movimientos', out); toast(`${out.length} dado(s) por pagado(s)`); analisisDif(cid, fecha);
}
function faltante(cid, fecha, dif){
  const c = cuenta(cid);
  window._nuevoPagado = fecha;
  editMov(null, {empresaId:c.empresaId, cuentaId:cid, tipo: dif<0?'egreso':'ingreso', categoria: dif<0?'Pago proveedores':'Cobranza clientes', fecha, monto:Math.abs(dif), origen:'manual', estado:'pendiente', glosa:'Detectado en conciliación '+fDate(fecha)});
  const h = $('.modal .dlg-h h3'); if(h) h.insertAdjacentHTML('beforeend',` <span class="tag cxc">se registra como pagado el ${fDate(fecha)}</span>`);
}

async function guardarUsuario(email){
  const em = (email || $('#uE').value).trim().toLowerCase();

  if(em===Sess.email && $('#uR').value!=='admin'){ toast('No puedes quitarte el rol de administrador'); return; }
  const o = {...(Store.data.usuarios.find(x=>x.email===em)||{creado:new Date().toISOString()}), id:em, email:em, nombre:$('#uN').value.trim(), rol:$('#uR').value, activo:$('#uA').value==='1'};
  await Store.put('usuarios', o);
  if(!email && $('#uC')?.checked){
    try{
      const app2 = firebase.apps.find(a=>a.name==='alta') || firebase.initializeApp(window.FLUXCAJA_FIREBASE, 'alta');
      try{ await app2.auth().createUserWithEmailAndPassword(em, crypto.getRandomValues(new Uint32Array(4)).join('-')+'Aa!'); }
      catch(e){ if(e.code!=='auth/email-already-in-use') throw e; }
      await app2.auth().sendPasswordResetEmail(em); await app2.auth().signOut();
      toast('Usuario creado: le llegará un correo para definir su contraseña', 5000);
    }catch(e){ alert('El rol quedó guardado, pero no se pudo crear la cuenta de acceso: '+(e.code||e.message)+'\nPuedes crearla en Firebase Console › Authentication.'); }
  } else toast('Usuario guardado');
  closeModal();
}

function resumenNeg(m){ const f = m.forestal||{}; return [f.tipoNegocio, f.predio, f.especie, f.volumen? `${Number(f.volumen).toLocaleString('es-CL')} ${f.unidad||''}`:''].filter(Boolean).join(' · '); }
function viewForestal(){
  const f = UI.for; const q = f.q.trim().toLowerCase(); const t = today(), lim = addDays(t,30);
  let ms = misCompromisos();
  const sups = [...new Set(ms.map(m=>m.creadoPor))].sort();

  const pend = ms.filter(m=>m.estado!=='pagado');
  const tot = pend.reduce((s,m)=>s+m.monto,0), t30 = pend.filter(m=>fEf(m)<=lim).reduce((s,m)=>s+m.monto,0);
  const est = pend.filter(m=>m.forestal?.estadoNeg==='Estimado').reduce((s,m)=>s+m.monto,0);
  const porMes = {}; pend.forEach(m=>{ const k=fEf(m).slice(0,7); porMes[k]=(porMes[k]||0)+m.monto; });
  const negocios = new Set(pend.map(m=>m.grupo||m.id)).size;
  return `<div class="kpis">
    <div class="kpi"><div class="l">Comprometido</div><div class="v neg">${fmt(tot)}</div><div class="s">pendiente · ${negocios} negocio(s), ${pend.length} pago(s)</div></div>
    <div class="kpi"><div class="l">Próximos 30 días</div><div class="v">${fmt(t30)}</div><div class="s">hasta el ${fDate(lim)}</div></div>
    <div class="kpi"><div class="l">Estimado</div><div class="v ${est?'':'pos'}">${fmt(est)}</div><div class="s">sin confirmar · ${tot? Math.round(est/tot*100):0}% del total</div></div>
    ${!esSupervisor()?`<div class="kpi"><div class="l">Supervisores</div><div class="v">${sups.length}</div><div class="s">con compromisos registrados</div></div>`:''}
  </div>

async function guardarForestal(id){
  const a = _auxSel && aux(_auxSel);
  if(!a){ toast('Selecciona el proveedor desde el buscador (o créalo)'); $('#mAux').focus(); return; }
  const monto = Math.round(+$('#fM').value||0), fecha = $('#fF').value, detalle = $('#fD').value.trim();
  if(!monto || monto<0){ toast('Ingresa el monto'); return; }
  if(!fecha){ toast('Ingresa la fecha del compromiso de pago'); return; }
  if(!detalle){ toast('Describe el negocio en el detalle'); $('#fD').focus(); return; }
  const forestal = {tipoNegocio:$('#fT').value, predio:$('#fP').value.trim(), especie:$('#fS').value, volumen: $('#fV').value===''?null:+$('#fV').value, unidad:$('#fU').value, precio: $('#fPr').value===''?null:+$('#fPr').value, estadoNeg:$('#fN').value, detalle};
  const eid = $('#fE').value; const ahora = new Date().toISOString();
  const base = {empresaId:eid, tipo:'egreso', categoria:CAT_FOR, origen:'forestal', contraparte:a.nombre, rut:a.rut, auxId:a.id, forestal, glosa: [forestal.tipoNegocio, forestal.predio].filter(Boolean).join(' · ')};
  if(id){
    const m = Store.data.movimientos.find(x=>x.id===id);
    await Store.put('movimientos', {...m, ...base, fecha, monto, actualizado:ahora, actualizadoPor:Sess.email}); closeModal(); toast('Compromiso actualizado'); return;
  }
  const n = Math.max(1, Math.min(36, +($('#fC')?.value)||1)), fr = $('#fR')?.value||'m';
  const grupo = n>1 ? uid() : null; const cuota = Math.floor(monto/n);
  const def = puedeEscribir() ? (cuentasDe(eid).find(c=>c.porDefecto)||cuentasDe(eid)[0]) : null;
  const out = [];
  for(let i=0;i<n;i++){
    const f = fr==='m'? addMonths(fecha,i) : addDays(fecha, (fr==='s'?7:14)*i);
    out.push({...base, id:uid(), fecha:f, monto: i===n-1 ? monto-cuota*(n-1) : cuota, estado:'pendiente', cuentaId:def?.id||null, grupo, cuota: n>1?`${i+1}/${n}`:null, creadoPor:Sess.email, creadoNombre:Sess.nombre||Sess.email, creado:ahora});
  }
  try{ await Store.putMany('movimientos', out); closeModal(); toast(n>1? `Compromiso registrado en ${n} cuotas` : 'Compromiso registrado'); }
  catch(e){ alert('No se pudo guardar: '+(e.code||e.message)); }
}

async function guardarAux(id){
  const r = $('#xR').value, n = $('#xN').value.trim();
  if(!rutValido(r)){ toast('RUT no válido (revisa el dígito verificador)'); return; }
  if(!n){ toast('Nombre obligatorio'); return; }
  const nid = auxId(r);
  if(nid!==id && aux(nid)){ toast(`Ese RUT ya existe: ${aux(nid).nombre}`); return; }
  const o = {...(id?aux(id):{}), id:nid, rut:fmtRut(r), nombre:n, tipo:$('#xT').value, obs:$('#xO').value.trim()};
  await Store.put('auxiliares', o);
  // propagar nombre/RUT a los movimientos manuales enlazados
  const rel = Store.data.movimientos.filter(m=>m.auxId===id || m.auxId===nid);
  const upd = rel.filter(m=>m.origen==='manual').map(m=>({...m, auxId:nid, rut:o.rut, contraparte:o.nombre}));
  if(id && id!==nid){ await Store.del('auxiliares', id); rel.filter(m=>m.origen!=='manual').forEach(m=>upd.push({...m, auxId:nid})); }
  if(upd.length) await Store.putMany('movimientos', upd);
  closeModal(); toast('Guardado');
}

async function auxImportExcel(file){
  if(!file) return;
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
  let h=-1, cR=-1, cN=-1;
  for(let i=0;i<Math.min(rows.length,30) && h<0;i++){ const r = rows[i].map(v=>normTxt(v)); const a=r.findIndex(v=>/rut/.test(v)), b=r.findIndex(v=>/razon|nombre|proveedor|cliente/.test(v)); if(a>=0&&b>=0){h=i;cR=a;cN=b;} }
  if(h<0){ alert('No encontré columnas de RUT y Nombre/Razón social en la primera hoja.'); return; }
  const tipo = UI.aux.tipo==='*' ? (confirm('¿Estos registros son CLIENTES?\nAceptar = clientes · Cancelar = proveedores') ? 'cliente':'proveedor') : UI.aux.tipo;
  const lista = rows.slice(h+1).filter(r=>rutValido(r[cR])).map(r=>({rut:r[cR], nombre:r[cN], tipo}));
  const inval = rows.slice(h+1).filter(r=>String(r[cR]).trim() && !rutValido(r[cR])).length;
  const n = await upsertAux(lista);
  toast(`${n} registros agregados/actualizados${inval?` · ${inval} RUT inválidos omitidos`:''}`, 4500);
}

    <div class="actions">${id?`<button class="btn dan" onclick="borrarEmpresa('${id}')">Eliminar</button>`:''}<span style="flex:1"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarEmpresa(${id?`'${id}'`:'null'})">Guardar</button></div>`);
}
async function guardarEmpresa(id){
  const nombre = $('#eN').value.trim(); if(!nombre){ toast('Nombre obligatorio'); return; }
  const o = {...(id?empresa(id):{}), nombre, rut:$('#eR').value.trim(), color:$('#eC').value, orden:+$('#eO').value||0};
  if(!id) o.id = uid();
  await Store.put('empresas', o); closeModal(); toast('Empresa guardada');
  if(!id && !cuentasDe(o.id).length) setTimeout(()=>editCuenta(null,o.id),150);
}
async function borrarEmpresa(id){
  const nm = Store.data.movimientos.filter(m=>m.empresaId===id).length, nc = cuentasDe(id).length;
  if(!confirm(`Se eliminará la empresa con ${nc} cuentas y ${nm} movimientos. ¿Continuar?`)) return;
  await Store.delMany('movimientos', Store.data.movimientos.filter(m=>m.empresaId===id).map(m=>m.id));
  await Store.delMany('cuentas', cuentasDe(id).map(c=>c.id)); await Store.del('empresas', id);
  if(UI.emp===id) UI.emp='*'; closeModal(); toast('Empresa eliminada');
}
function editCuenta(id, eid){
  const c = id? cuenta(id) : {empresaId:eid, banco:'', numero:'', alias:'', saldo:0, fechaSaldo:today(), cupoLinea:0, porDefecto: !cuentasDe(eid).length};
  modal(`<h3>${id?'Editar':'Nueva'} cuenta · ${esc(empresa(c.empresaId)?.nombre)}</h3><div class="form">
    <label>Banco<input id="cB" value="${esc(c.banco)}" list="bancos"></label>
    <datalist id="bancos">${['Banco de Chile','BancoEstado','Santander','BCI','Scotiabank','Itaú','Security','BICE','Internacional','Falabella','Consorcio'].map(b=>`<option>${b}</option>`).join('')}</datalist>
    <label>N° de cuenta<input id="cN" value="${esc(c.numero)}"></label>
    <label>Alias<input id="cA" value="${esc(c.alias)}" placeholder="Ej: BCI principal"></label>
    <label>Línea de crédito (cupo)<input id="cL" type="number" value="${+c.cupoLinea||0}"></label>
    <label>Saldo actual<input id="cS" type="number" value="${+c.saldo||0}"></label>
    <label>Fecha del saldo<input id="cF" type="date" value="${c.fechaSaldo||today()}"></label>
    <label class="full" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="cD" ${c.porDefecto?'checked':''}> Cuenta por defecto (recibe los documentos importados)</label></div>
    <div class="actions">${id?`<button class="btn dan" onclick="borrarCuenta('${id}')">Eliminar</button>`:''}<span style="flex:1"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarCuenta(${id?`'${id}'`:'null'},'${c.empresaId}')">Guardar</button></div>`);
}
async function guardarCuenta(id, eid){
  const o = {...(id?cuenta(id):{id:uid(), empresaId:eid}), banco:$('#cB').value.trim(), numero:$('#cN').value.trim(), alias:$('#cA').value.trim(), cupoLinea:Math.round(+$('#cL').value||0), saldo:Math.round(+$('#cS').value||0), fechaSaldo:$('#cF').value, porDefecto:$('#cD').checked};
  if(!o.banco && !o.alias){ toast('Indica banco o alias'); return; }
  const upd = [o];
  if(o.porDefecto) cuentasDe(eid).filter(c=>c.id!==o.id && c.porDefecto).forEach(c=>upd.push({...c, porDefecto:false}));
  await Store.putMany('cuentas', upd);
  const antes = id ? Store.data.saldos.find(x=>x.id===o.id+'_'+o.fechaSaldo) : null;
  if(o.fechaSaldo && (!id || !antes || antes.saldo!==o.saldo)) await Store.put('saldos', {id:o.id+'_'+o.fechaSaldo, cuentaId:o.id, empresaId:o.empresaId, fecha:o.fechaSaldo, saldo:o.saldo, nota: id?'editado en ficha de cuenta':'saldo inicial', usuario: Store.user?.email||'local', creado:new Date().toISOString()});
  // asignar documentos sin cuenta a la cuenta por defecto
  if(o.porDefecto){ const sin = Store.data.movimientos.filter(m=>m.empresaId===eid && !m.cuentaId); if(sin.length) await Store.putMany('movimientos', sin.map(m=>({...m, cuentaId:o.id}))); }
  closeModal(); toast('Cuenta guardada');
}
async function borrarCuenta(id){
  const n = Store.data.movimientos.filter(m=>m.cuentaId===id).length;
  if(!confirm(`¿Eliminar la cuenta? ${n} movimientos quedarán sin cuenta asignada.`)) return;
  await Store.putMany('movimientos', Store.data.movimientos.filter(m=>m.cuentaId===id).map(m=>({...m, cuentaId:null})));
  await Store.del('cuentas', id); closeModal(); toast('Cuenta eliminada');
}

/* =====================================================================
   VISTA: AJUSTES
   ===================================================================== */
function viewAjustes(){
  const nPag = Store.data.movimientos.filter(m=>m.estado==='pagado').length;
  return `<div class="grid2">
  <div class="card"><h2>Respaldo</h2>
    <p class="small muted">Descarga todos los datos en JSON o restáuralos (útil para migrar de modo local a Firebase).</p>
    <p class="small muted">${Store.data.empresas.length} empresas · ${Store.data.cuentas.length} cuentas · ${Store.data.movimientos.length} movimientos · ${Store.data.saldos.length} saldos reales</p>
    <div class="row"><button class="btn" onclick="exportJSON()">Descargar respaldo</button>
    <label class="btn">Restaurar respaldo<input type="file" accept=".json" class="hide" onchange="importJSON(this.files[0])"></label></div>
  </div>
  <div class="card"><h2>Limpieza</h2>
    <p class="small muted">${nPag} movimientos pagados guardados como historial. Ojo: los pagos se usan para calcular el saldo teórico; elimina solo períodos ya conciliados.</p>
    <div class="row"><label>Eliminar pagados con fecha anterior a<input type="date" id="lmF" value="${addMonths(today(),-6)}"></label><button class="btn dan" onclick="limpiar()">Eliminar</button></div>
  </div>
  </div>`;
}
/* versión, historial y sesión: accesibles desde la barra superior */
function verVersion(){
  modal(`<h3>Flujo de Caja Consolidado · versión ${APP_VERSION}</h3>
    <p class="small muted">${Store.mode==='firebase'?`Conectado a Firebase (${esc(window.FLUXCAJA_FIREBASE.projectId)})`:'Modo local: datos solo en este navegador'}</p>
    <div class="small">${CHANGELOG.map(([v,f,t])=>`<p style="margin:6px 0"><b>${v}</b> <span class="muted">${f}</span><br>${esc(t)}</p>`).join('')}</div>
    <div class="actions">${window._bip?'<button class="btn" onclick="_bip.prompt()">Instalar app</button>':''}<button class="btn" onclick="actualizarApp()">Buscar actualización</button><button class="btn pri" onclick="closeModal()">Cerrar</button></div>`);
}
function menuUsuario(){
  if(Store.mode!=='firebase'){ modal(`<h3>Modo local</h3><p>Viendo como <b>${esc(ROLES[Sess.rol].lbl)}</b>.</p><div class="seg">${Object.entries(ROLES).map(([k,r])=>`<button class="${Sess.rol===k?'on':''}" onclick="closeModal();simularRol('${k}')">${r.lbl}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`); return; }
  modal(`<h3>Sesión</h3><p>${esc(Sess.nombre||'')}<br>Usuario: <b>${esc(Sess.email||'')}</b><br>Rol: <b>${esc(ROLES[Sess.rol]?.lbl||'')}</b></p>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn dan" onclick="closeModal();firebase.auth().signOut()">Cerrar sesión</button></div>`);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({app:'fluxcaja', v:1, fecha:today(), data:Store.data},null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `flujo_consolidado_respaldo_${today()}.json`; a.click();
}
async function importJSON(file){
  if(!file) return; try{
    const j = JSON.parse(await file.text()); if(j.app!=='fluxcaja') throw new Error('Archivo no válido');
    if(!confirm('Se agregarán/reemplazarán los registros del respaldo. ¿Continuar?')) return;
    for(const c of COLS) await Store.putMany(c, (j.data[c]||[]).map(o=>({...o})));
    toast('Respaldo restaurado');
  }catch(e){ alert('Error: '+e.message); }
}
async function limpiar(){
  const f = $('#lmF').value; const ids = Store.data.movimientos.filter(m=>m.estado==='pagado' && fEf(m)<f).map(m=>m.id);
  if(!ids.length){ toast('Nada que eliminar'); return; }
  if(!confirm(`¿Eliminar ${ids.length} movimientos pagados?`)) return; await Store.delMany('movimientos', ids); toast('Listo');
}
async function cargarDemo(){
  const t = today(); const e1={id:uid(),nombre:'Agrícola Demo',rut:'76.111.111-1',color:'#2e7355',orden:0}, e2={id:uid(),nombre:'Transportes Demo',rut:'76.222.222-2',color:'#2f5d8a',orden:1};
  const c1={id:uid(),empresaId:e1.id,banco:'BCI',numero:'12345678',alias:'BCI principal',saldo:45000000,fechaSaldo:t,porDefecto:true,cupoLinea:20000000};
  const c2={id:uid(),empresaId:e1.id,banco:'Santander',numero:'987654',alias:'Santander',saldo:8000000,fechaSaldo:t,porDefecto:false};
  const c3={id:uid(),empresaId:e2.id,banco:'Banco de Chile',numero:'555111',alias:'Chile',saldo:12000000,fechaSaldo:t,porDefecto:true};
  const mv=[]; const prov=['Agroquímicos Sur','Combustibles Araucanía','Maderas del Sur','Repuestos Angol','Fertilizantes SpA']; const cli=['Exportadora Frutas','Aserradero Norte','Frigorífico Sur'];
  for(let i=0;i<40;i++){ const e=i%3?e1:e2; mv.push({id:uid(),empresaId:e.id,cuentaId:e===e1?c1.id:c3.id,origen:'cxp',tipo:'egreso',categoria:CAT_CXP,fecha:addDays(t,-10+i*3),monto:Math.round(800000+Math.random()*6e6),contraparte:prov[i%5],rut:'77.'+(100+i)+'.000-'+(i%9),tipoDoc:'FAC',folio:String(1000+i),estado:'pendiente'}); }
  for(let i=0;i<18;i++){ mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'cxc',tipo:'ingreso',categoria:CAT_CXC,fecha:addDays(t,-5+i*6),monto:Math.round(3e6+Math.random()*12e6),contraparte:cli[i%3],rut:'96.'+(500+i)+'.000-1',tipoDoc:'FAC',folio:String(5000+i),estado:'pendiente'}); }
  const g=uid(); for(let i=0;i<24;i++) mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'manual',tipo:'egreso',categoria:'Cuota crédito bancario',fecha:addMonths(addDays(t,5),i),monto:2350000,contraparte:'BCI',glosa:'Crédito comercial',estado:'pendiente',grupo:g,cuota:`${i+1}/24`});
  const g2=uid(); for(let i=0;i<12;i++) mv.push({id:uid(),empresaId:e2.id,cuentaId:c3.id,origen:'manual',tipo:'egreso',categoria:'Leasing',fecha:addMonths(addDays(t,10),i),monto:1850000,contraparte:'BCI Leasing',glosa:'Leasing camión',estado:'pendiente',grupo:g2,cuota:`${i+1}/12`});
  for(let i=0;i<4;i++) mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,origen:'manual',tipo:'egreso',categoria:'Remuneraciones',fecha:addMonths(t.slice(0,8)+'28',i),monto:18500000,contraparte:'Personal',estado:'pendiente'});
  const rv = n => { const c=String(n); return fmtRut(c+dvRut(c)); };
  const rutDe = n => rv((n.startsWith('Exp')||n.startsWith('Ase')||n.startsWith('Fri') ? 96500000 : 77100000) + [...n].reduce((h,c)=>(h*31+c.charCodeAt(0))%9973,7));
  mv.forEach(m=>{ if(m.rut){ m.rut = rutDe(m.contraparte); m.auxId = auxId(m.rut); } });
  await upsertAux(mv.filter(m=>m.rut).map(m=>({rut:m.rut, nombre:m.contraparte, tipo:m.origen==='cxc'?'cliente':'proveedor'})));
  const neg = [['Bosque en pie','Fundo Los Robles, Collipulli','Pino radiata',1200,'m³ ssc',18500,'Confirmado',3],['Madera orilla de camino','Predio El Maitén, Angol','Eucalyptus globulus',450,'m³',32000,'Estimado',1]];
  const provF = [{rut:fmtRut('11111111'),nombre:'Juan Pérez (propietario)'},{rut:fmtRut('22222222'),nombre:'Forestal San Luis SpA'}];
  neg.forEach(([tn,pr,es,vol,un,pre,est,n],k)=>{ const g=n>1?uid():null, tot=vol*pre; for(let i=0;i<n;i++) mv.push({id:uid(),empresaId:e1.id,cuentaId:c1.id,tipo:'egreso',categoria:'Compra de madera y bosques',origen:'forestal',fecha:addMonths(addDays(t,12+k*9),i),monto:Math.round(tot/n),contraparte:provF[k].nombre,rut:provF[k].rut,auxId:auxId(provF[k].rut),estado:'pendiente',grupo:g,cuota:n>1?`${i+1}/${n}`:null,forestal:{tipoNegocio:tn,predio:pr,especie:es,volumen:vol,unidad:un,precio:pre,estadoNeg:est,detalle:'Negocio de ejemplo: cosecha a cargo del vendedor, pago contra despacho.'},glosa:tn+' · '+pr,creadoPor:'supervisor@local',creadoNombre:'Supervisor de prueba',creado:new Date().toISOString()}); });
  await upsertAux(provF.map(p=>({...p,tipo:'proveedor'})));
  await Store.putMany('empresas',[e1,e2]); await Store.putMany('cuentas',[c1,c2,c3]); await Store.putMany('movimientos',mv); toast('Datos de ejemplo cargados');
}

/* ---------- modal ---------- */
function modal(html, wide){ closeModal(); const d=document.createElement('div'); d.className='modal-bg'; d.id='mdl'; d.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="dlg-c">${html}</div></div>`;
  const m = d.firstElementChild, c = m.firstElementChild;
  const h = c.querySelector(':scope > h3'); if(h){ const hh=document.createElement('div'); hh.className='dlg-h'; hh.appendChild(h); m.insertBefore(hh,c); }
  const acts = [...c.querySelectorAll(':scope > .actions')].pop(); if(acts){ const ff=document.createElement('div'); ff.className='dlg-f'; ff.appendChild(acts); m.appendChild(ff); } d.addEventListener('mousedown',e=>{ if(e.target===d) closeModal(); }); document.body.appendChild(d); }
function closeModal(){ $('#mdl')?.remove(); if(!document.querySelector('#mdl')) setTimeout(()=>{ if(!document.querySelector('#mdl')) window._nuevoPagado=null; },0); }
addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- PWA ---------- */
async function actualizarApp(){
  try{ const r = await navigator.serviceWorker?.getRegistration(); if(r) await r.update(); }catch(e){}
  toast('Recargando…'); setTimeout(()=>location.reload(), 600);
}
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window._bip=e; });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- arranque ---------- */
(async()=>{
  if(typeof XLSX==='undefined') console.warn('SheetJS no cargó (sin conexión la primera vez).');
  if(Store.hasFirebase){ try{ await Store.initFirebase(); return; }catch(e){ console.error(e); alert('No se pudo iniciar Firebase: '+e.message+'\nSe usará modo local.'); } }
  Store.initLocal(); render();
})();
</script>
